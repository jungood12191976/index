  body {

  .card {

function normalize(s) { return (s || "").toLowerCase().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim(); }
function wordOverlapRatio(target, said) {
  const t = normalize(target).split(" ").filter(Boolean);
  const sSet = new Set(normalize(said).split(" ").filter(Boolean));
  if (t.length === 0) return 0;
  let match = 0;
  t.forEach(w => { if (sSet.has(w)) match += 1; });
  return match / t.length;
}
function hexToBlobUrl(hex, mime) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  return URL.createObjectURL(new Blob([bytes], { type: mime }));
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();

function pickNightCharacterCount() { return Math.random() < 0.3 ? 2 : 1; }

function pickNightCharacters(count) {
  const weighted = [];
  NIGHT_CHARACTERS.forEach(c => { for (let i = 0; i < (c.weight || 1); i++) weighted.push(c); });
  const chosen = [];
  const usedIds = new Set();
  let guard = 0;
  while (chosen.length < count && chosen.length < NIGHT_CHARACTERS.length && guard < 200) {
    guard++;
    const pick = weighted[Math.floor(Math.random() * weighted.length)];
    if (!usedIds.has(pick.id)) { chosen.push(pick); usedIds.add(pick.id); }
  }
  return chosen;
}

function recordLearnedPhrase(phrase, note) {
  if (!phrase) return;
  const exists = state.learnedPhrases.some(p => p.phrase.toLowerCase() === String(phrase).toLowerCase());
  if (!exists) {
    state.learnedPhrases.unshift({ phrase: String(phrase), note: note || "" });
    if (state.learnedPhrases.length > 200) state.learnedPhrases.length = 200;
    localStorage.setItem("learned_phrases", JSON.stringify(state.learnedPhrases));
  }
}

function recordLearnedPhrases(list) {
  (list || []).forEach(f => { if (f && f.phrase) recordLearnedPhrase(f.phrase, f.note || f.ja || ""); });
}

function getNow() {
  const d = new Date();
  return { h: d.getHours(), m: d.getMinutes() };
}
function minutesOfDay(h, m) { return h * 60 + m; }
function inWindow(startH, startM, endH, endM) {
  const now = getNow();
  const cur = minutesOfDay(now.h, now.m);
  return cur >= minutesOfDay(startH, startM) && cur <= minutesOfDay(endH, endM);
}
function morningInWindow() { return inWindow(5, 0, 8, 35); }
function middayInWindow() { return inWindow(13, 0, 15, 0); }
function nightInWindow() { return inWindow(21, 0, 23, 0); }
function morningDoneToday() { return state.challengeDate === todayStr(); }
function middayDoneToday() { return state.middayDate === todayStr(); }
function nightDoneToday() { return state.nightDate === todayStr(); }

async function generateTTS(text, voice) {
  if (voice.provider === "eleven") {
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice.voice_id}`, {
      method: "POST",
      headers: { "xi-api-key": state.elevenApiKey, "Content-Type": "application/json", "Accept": "audio/mpeg" },
      body: JSON.stringify({ text, model_id: "eleven_flash_v2_5" })
    });
    if (!res.ok) throw new Error("ElevenLabs音声生成に失敗しました（status " + res.status + "）");
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  } else {
    const res = await fetch(`https://api.minimax.io/v1/t2a_v2?GroupId=${encodeURIComponent(state.minimaxGroupId)}`, {
      method: "POST",
      headers: { "Authorization": "Bearer " + state.minimaxApiKey, "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "speech-2.6-hd", text, stream: false, language_boost: "English",
        voice_setting: { voice_id: voice.voice_id, speed: 0.95, vol: 1.0, pitch: 0 },
        audio_setting: { sample_rate: 32000, bitrate: 128000, format: "mp3", channel: 1 }
      })
    });
    if (!res.ok) throw new Error("MiniMax音声生成に失敗しました（status " + res.status + "）");
    const data = await res.json();
    const hex = data.data && data.data.audio;
    if (!hex) throw new Error("MiniMaxから音声データが返りませんでした");
    return hexToBlobUrl(hex, "audio/mpeg");
  }
}

function normalizeGenderHint(g) {
  if (!g) return null;
  const s = String(g).toLowerCase();
  if (/女|female|woman|girl/.test(s)) return "female";
  if (/男|male|man|boy/.test(s)) return "male";
  return null;
}

function pickVoiceForAccent(hint, genderHint) {
  const pool = state.selectedVoiceIds.map(getVoiceByKey).filter(Boolean);
  if (pool.length === 0) return null;
  const wantGender = normalizeGenderHint(genderHint);
  const genderPool = wantGender ? pool.filter(v => v.gender === wantGender) : [];
  const searchPools = genderPool.length > 0 ? [genderPool, pool] : [pool];

  if (hint) {
    const kwSets = [
      { test: /india|インド/i, kw: ["india","indian"] },
      { test: /british|england|uk|イギリス/i, kw: ["british","uk","england"] },
      { test: /french|フランス/i, kw: ["french"] },
      { test: /american|アメリカ/i, kw: ["american","us"] },
      { test: /singapore|シンガポール/i, kw: ["singapore"] },
      { test: /australia|オーストラリア/i, kw: ["australia"] },
      { test: /chinese|china|中国/i, kw: ["chinese","china"] },
    ];
    for (const searchPool of searchPools) {
      for (const set of kwSets) {
        if (set.test.test(hint)) {
          for (const k of set.kw) {
            const match = searchPool.find(v => (v.accent||"").toLowerCase().includes(k) || (v.name||"").toLowerCase().includes(k));
            if (match) return match;
          }
        }
      }
    }
  }
  // アクセント一致がなければ、性別だけでも合わせる
  if (genderPool.length > 0) return genderPool[Math.floor(Math.random() * genderPool.length)];
  return pool[Math.floor(Math.random() * pool.length)];
}

async function callGeminiJSON(prompt, temperature, _retryCount) {
  const retryCount = _retryCount || 0;
  let modelsToTry = ["gemini-2.5-flash", "gemini-flash-latest", "gemini-2.0-flash", "gemini-1.5-flash"];
  try {
    const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(state.geminiApiKey)}`);
    if (listRes.ok) {
      const listData = await listRes.json();
      const usable = (listData.models || [])
        .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes("generateContent"))
        .map(m => m.name.replace(/^models\//, ""));
      if (usable.length > 0) modelsToTry = usable.filter(n => /flash/i.test(n)).concat(usable.filter(n => !/flash/i.test(n)));
    }
  } catch (e) {}

  let res = null, lastStatus = null;
  outerG:
  for (const modelName of modelsToTry) {
    for (let attempt = 0; attempt < 3; attempt++) {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(state.geminiApiKey)}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: temperature } })
      });
      if (res.ok) break outerG;
      lastStatus = res.status;
      if (res.status === 503 || res.status === 429) { await new Promise(r => setTimeout(r, 1500 * (attempt+1))); continue; }
      break;
    }
    if (res && res.ok) break;
  }
  if (!res || !res.ok) throw new Error("Gemini APIエラー（status " + lastStatus + "）");
  const data = await res.json();
  let text = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
  if (!text) throw new Error("応答が空でした");
  text = text.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  try {
    return JSON.parse(text);
  } catch (parseErr) {
    // 簡易修復：末尾の余計なカンマなどを除去して再トライ
    try {
      const repaired = text.replace(/,(\s*[}\]])/g, "$1");
      return JSON.parse(repaired);
    } catch (e2) {
      if (retryCount < 1) {
        // 1回だけ、生成そのものをやり直す
        return callGeminiJSON(prompt, temperature, retryCount + 1);
      }
      throw new Error("AIの応答が不完全でした。もう一度お試しください");
    }
  }
}

会話の構成:
1. opener: 今日あった他愛もない出来事や近況を2〜3文で話しかける、最初のメッセージ
2. turn1_options: openerへの返事として、ユーザーが選ぶ短い英文を2つ（どちらも自然で、方向性が少し違うもの。例: 一方は元気に、もう一方は落ち着いた感じ、など）
3. reply1: どちらの返事にも自然につながる形で、${character.name}が話を広げる次のメッセージ（2〜3文、最後に軽い問いかけを含める）
4. turn2_options: reply1への返事の選択肢2つ
5. reply2: それに続く${character.name}のメッセージ（2〜3文、最後に軽い問いかけ）
6. turn3_options: reply2への返事の選択肢2つ
7. closing: 最後の返事を受けての、${character.name}からの短い締めのメッセージ（1〜2文、温かく会話を終える）
8. topicSummary: 今回の会話の話題を10〜15文字程度の日本語で一言（次回の継続用）

すべて中学2年〜高校レベルの語彙を中心にした、実際にチャットで使うような自然でカジュアルな英語にしてください。日本語訳（_jaという名前で各項目に対応）も付けてください。

出力するJSON形式（このスキーマに厳密に従い、JSON以外は一切出力しないこと）:
{
  "opener": "...", "opener_ja": "...",
  "turn1_options": ["...", "..."], "turn1_options_ja": ["...", "..."],
  "reply1": "...", "reply1_ja": "...",
  "turn2_options": ["...", "..."], "turn2_options_ja": ["...", "..."],
  "reply2": "...", "reply2_ja": "...",
  "turn3_options": ["...", "..."], "turn3_options_ja": ["...", "..."],
  "closing": "...", "closing_ja": "...",
  "topicSummary": "..."
}`;

  try {
    const parsed = await callGeminiJSON(prompt, 1.05);
    if (!parsed.opener || !Array.isArray(parsed.turn1_options)) throw new Error("生成内容が不完全でした。もう一度お試しください");
    const voice = await getOrAssignNightVoice(character);
    if (!voice) throw new Error("使える声がありません");

    const friendLines = [parsed.opener, parsed.reply1, parsed.reply2, parsed.closing];
    const audioUrls = [];
    for (const line of friendLines) {
      audioUrls.push(await generateTTS(line, voice));
    }

    state.nightCharacter = character;
    state.nightData = parsed;
    state.nightAudioUrls = audioUrls;
    state.nightFriendIdx = 0;
    state.nightMode = "friend";
    state.nightSpeakCount = 0;
    state.nightAttemptMsg = "";
    state.nightUseSelfReport = false;
    state.nightRecFailStreak = 0;
    state.nightLoading = false;
    stopLoadingTipLoop();
    state.phase = "night_message";
    render();
    setTimeout(() => smartPlay(state.nightAudioUrls[0], true), 200);
  } catch (e) {
    state.nightError = e.message;
    state.nightLoading = false;
    stopLoadingTipLoop();
    render();
  }
}

function playNightAudio() {
  smartPlay(state.nightAudioUrls[state.nightFriendIdx], true);
}

function nightProceedFromFriend() {
  if (state.nightFriendIdx >= 3) {
    // closingまで見終わった＝このキャラクターとの会話は終了
    finishOneNightCharacter();
    return;
  }
  state.nightMode = "choice";
  render();
}

function nightOptionSets() {
  return [state.nightData.turn1_options, state.nightData.turn2_options, state.nightData.turn3_options];
}
function nightOptionSetsJa() {
  return [state.nightData.turn1_options_ja, state.nightData.turn2_options_ja, state.nightData.turn3_options_ja];
}

function pickNightOption(idx) {
  const options = nightOptionSets()[state.nightFriendIdx];
  state.nightPickedText = options[idx];
  state.nightMode = "speak";
  state.nightSpeakCount = 0;
  state.nightAttemptMsg = "";
  render();
}

function startNightSpeakAttempt() {
  if (state.nightListening) return;
  const target = state.nightPickedText;
  if (state.nightUseSelfReport) { registerNightSpeakResult(true); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { registerNightSpeakResult(true); return; }
  let rec;
  try { rec = new SR(); } catch (e) { registerNightSpeakResult(true); return; }
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  state.nightListening = true;
  state.nightAttemptMsg = "聞いています…";
  render();
  let handled = false;
  rec.onresult = (e) => {
    handled = true;
    state.nightRecFailStreak = 0;
    const said = e.results[0][0].transcript;
    const ratio = wordOverlapRatio(target, said);
    registerNightSpeakResult(ratio >= 0.3, said);
  };
  rec.onerror = () => {
    if (handled) return;
    handled = true;
    state.nightListening = false;
    state.nightRecFailStreak += 1;
    if (state.nightRecFailStreak >= 2) {
      state.nightUseSelfReport = true;
      state.nightAttemptMsg = "音声認識がうまく動かないため、次からはタップでカウントする方式に切り替えます";
    } else {
      state.nightAttemptMsg = "もう一度どうぞ";
    }
    render();
  };
  rec.onend = () => { state.nightListening = false; if (!handled) render(); };
  try { rec.start(); } catch (e) { registerNightSpeakResult(true); }
}

function registerNightSpeakResult(pass) {
  state.nightListening = false;
  if (pass) {
    state.nightSpeakCount = Math.min(state.nightSpeakTotal, state.nightSpeakCount + 1);
    state.nightAttemptMsg = "✓ " + state.nightSpeakCount + "/" + state.nightSpeakTotal;
    if (state.nightSpeakCount >= state.nightSpeakTotal) {
      render();
      setTimeout(() => {
        state.nightFriendIdx += 1;
        state.nightMode = "friend";
        state.nightAttemptMsg = "";
        render();
        smartPlay(state.nightAudioUrls[state.nightFriendIdx], true);
      }, 350);
      return;
    }
  } else {
    state.nightAttemptMsg = "もう一度お願いします";
  }
  render();
}

function finishOneNightCharacter() {
  // 話題を継続ストーリー用に保存
  state.nightHistory[state.nightCharacter.id] = { lastDate: todayStr(), topicSummary: state.nightData.topicSummary || "" };
  localStorage.setItem("night_history", JSON.stringify(state.nightHistory));

  const entry = { date: todayStr(), character: state.nightCharacter.name };
  state.nightLog.unshift(entry);
  localStorage.setItem("night_log", JSON.stringify(state.nightLog));

  state.nightQueueIdx += 1;
  if (state.nightQueueIdx < state.nightQueue.length) {
    generateNightChatForCurrentCharacter();
  } else {
    state.nightDate = todayStr();
    localStorage.setItem("night_date", state.nightDate);
    state.phase = "night_done";
    render();
  }
}

function resetNightVoices() {
  state.nightVoices = {};
  localStorage.removeItem("night_voices");
  render();
}

function resetNightForTesting() {
  state.nightDate = "";
  localStorage.removeItem("night_date");
  sessionStorage.removeItem("night_queue_date");
  state.nightQueue = [];
  render();
}

async function startTodayChallenge() {
  if (state.selectedVoiceIds.length < 1) { state.errorMsg = "先に声を選んでください"; state.phase = "voices"; render(); return; }
  if (!state.geminiApiKey) {
    const keyInput = document.getElementById("geminiKeyInputChallenge");
    if (keyInput) { state.geminiApiKey = keyInput.value.trim(); localStorage.setItem("gemini_api_key", state.geminiApiKey); }
    if (!state.geminiApiKey) { state.challengeError = "Gemini APIキーを入力してください"; render(); return; }
  }

  state.challengeLoading = true;
  state.challengeError = "";
  startLoadingTipLoop();
  render();

  const callType = CALL_TYPES_BASE[Math.floor(Math.random() * CALL_TYPES_BASE.length)];
  const prompt = `あなたは英語学習教材のライターです。以下の設定に基づいて、リアルな（教科書的ではない）電話の音声スクリプトを1つ作成してください。

設定: ${buildCompanyContext()}

電話の種類: ${callType}

発信者の国籍・話し方はランダムに、多様に設定してください（例：日本在住のインド人ビジネスマン、麻布十番在住のイギリス人の奥様、フランス人の奥様、アメリカ人の顧客、シンガポール人のバイヤーなど）。まれに、全く関係ない会社宛ての間違い電話や、要領を得ないいたずらっぽい電話が混ざっても構いません（その場合も自然な英語にしてください）。発信者の性別もランダムに設定し、callerGenderに"male"または"female"を入れてください。callerNameは、その性別に合った一般的な名前にしてください（女性の名前なのに男性的な内容にならないよう注意）。

スクリプトは実際の電話のように、多少のフィラー（um, well, actually, so, you know）や、少し余分な情報を含み、5〜8文程度の自然な長さにしてください。中学2年〜高校レベルの語彙を中心にしつつ、多少難しい単語が混じっても構いません。**電話番号・注文番号・時刻・金額などの具体的な数字が話に含まれる場合は、曖昧にせず必ず明確な数字として含めてください**（例:「080-1234-5678」「3時」「5,000円」など）。

その後、この電話の内容を理解できているか確認する設問を3つ、日本語で作成してください。3つのうち必ず1つは「電話の中で言われた電話番号・時刻・金額などの具体的な数字は何だったか」を問う設問にし、正解の数字と、聞き間違えそうな紛らわしい数字を2つ選択肢にしてください（scriptに数字が含まれない場合は、代わりに別の具体的な固有名詞を問う設問にしてください）。残りの2つは「誰から/どんな会社からの電話か」「何を求められているか」を、それぞれ日本語の3択で。

さらに以下も含めてください:
1. callerName（発信者の名前）とcallerCompany（会社名。個人の場合は空文字でよい）
2. callerAccent: 発信者の国籍・アクセントを表す短い英語または日本語（例: "Indian", "British", "French", "American"）
3. callerGender: "male" または "female"
4. fillers: scriptに実際に含まれる「フィラー・つなぎ言葉」を2〜4個選び、それぞれ日本語で一言メモ
5. actionQuestion: 「この電話の内容がよく理解できなかった場合、電話口で何と言うのが適切か」を問う設問（英語の選択肢3つ、正解は初心者でも使える現実的な対応、note付き）
6. bossQuestions: 上司が「今の電話は何だったの？」と日本語で尋ねてくる場面を2つ作成してください。1つ目は「誰から/どんな内容の電話だったか」、2つ目は「相手が何を求めているか」を尋ねるものにしてください。それぞれ、qは上司の日本語のセリフ、optionsはその答えとなる**英語の文**を3つ（1つが正解、2つはもっともらしい誤答）、correctIndexで正解を示してください。さらに、正解の英文の中でやや難しい単語があれば、hardWordsとして1〜2個、発音記号(ipa)と意味(ja)を付けてください（簡単な文なら空配列でよい）。
7. callbackScript: ユーザーが折り返し電話をかける際に読み上げる、やや長め（4〜6文程度）の自然な英文。scriptで話された内容に対する適切な折り返し（名乗り、要件の確認、日程調整など）にしてください。数字（電話番号など）に言及する場合は省略せず明確に含めてください。
8. callbackStressWords: callbackScriptの中で、特に強く読むべき（強勢を置くべき）重要な単語を4〜7個、scriptに実際に含まれる形で選んでください。
9. callbackHardWords: callbackScriptの中で、中学2年〜高校レベルを超えるやや難しい単語を2〜4個選び、それぞれ発音記号(ipa)と日本語の意味(ja)を付けてください（多すぎないように）。

出力するJSON形式（このスキーマに厳密に従い、説明文やマークダウンは一切含めずJSONのみを出力すること）:
{
  "callType": "${callType}",
  "callerName": "名前",
  "callerCompany": "会社名（なければ空文字）",
  "callerAccent": "アクセントのヒント",
  "callerGender": "male または female",
  "script": "電話の英文全体（1つの文字列）",
  "ja": "scriptの全文を、省略せず自然な日本語に翻訳したもの（要約ではなく全文訳）",
  "fillers": [ { "phrase": "you know", "note": "特に意味はない口癖" } ],
  "questions": [ { "q": "設問", "options": ["a","b","c"], "correctIndex": 0 } ],
  "actionQuestion": { "situation": "状況説明", "options": ["a","b","c"], "correctIndex": 0, "note": "解説" },
  "bossQuestions": [
    { "q": "上司の日本語のセリフ1", "options": ["English sentence A","English sentence B","English sentence C"], "correctIndex": 0, "hardWords": [] },
    { "q": "上司の日本語のセリフ2", "options": ["English sentence A","English sentence B","English sentence C"], "correctIndex": 0, "hardWords": [] }
  ],
  "callbackScript": "折り返し電話で読み上げる長めの英文",
  "callbackStressWords": ["word1","word2"],
  "callbackHardWords": [ { "word": "reschedule", "ipa": "riːˈskɛdʒuːl", "ja": "予定を変更する" } ]
}`;

  try {
    const parsed = await callGeminiJSON(prompt, 1.05);
    if (!parsed.script || !Array.isArray(parsed.questions) || parsed.questions.length === 0) throw new Error("生成内容が不完全でした。もう一度お試しください");

    parsed.fillers = (Array.isArray(parsed.fillers) ? parsed.fillers : []).filter(f =>
      f && f.phrase && parsed.script.toLowerCase().includes(String(f.phrase).toLowerCase())
    ).slice(0, 4);

    if (parsed.actionQuestion && Array.isArray(parsed.actionQuestion.options)) {
      parsed.questions.push({
        q: parsed.actionQuestion.situation || "内容がよく理解できなかったとき、電話で何と言いますか？",
        options: parsed.actionQuestion.options,
        correctIndex: parsed.actionQuestion.correctIndex || 0,
        note: parsed.actionQuestion.note || "",
        isAction: true
      });
    }

    if (!Array.isArray(parsed.bossQuestions) || parsed.bossQuestions.length === 0) {
      parsed.bossQuestions = [
        { q: "今の電話、何だったの？", options: [parsed.ja.split("。")[0] || "It was a customer inquiry.", "It was a wrong number.", "It was a delivery problem."], correctIndex: 0 }
      ];
    }
    if (!parsed.callbackScript) {
      parsed.callbackScript = "Hello, this is calling back regarding your earlier call. I'm sorry I couldn't answer at that time. Could you tell me a bit more about what you need? I'll make sure to follow up as soon as possible. Thank you for your patience.";
    }
    if (!Array.isArray(parsed.callbackStressWords)) parsed.callbackStressWords = [];
    if (!Array.isArray(parsed.callbackHardWords)) parsed.callbackHardWords = [];

    const voice = pickVoiceForAccent(parsed.callerAccent, parsed.callerGender);
    if (!voice) throw new Error("使える声がありません");
    const audioUrl = await generateTTS(parsed.script, voice);

    recordLearnedPhrases(parsed.fillers);
    recordLearnedPhrases(parsed.callbackHardWords ? parsed.callbackHardWords.map(w => ({ phrase: w.word, note: w.ja })) : []);

    // 昼のメールで「同じ相手からの続き」を演出できるように、今朝の相手情報を保存しておく
    state.todayMorningContext = { callerName: parsed.callerName, callerCompany: parsed.callerCompany, callType: parsed.callType, ja: parsed.ja, date: todayStr() };
    sessionStorage.setItem("today_morning_context", JSON.stringify(state.todayMorningContext));

    state.challengeData = parsed;
    state.challengeAudioUrl = audioUrl;
    state.challengePlaysUsed = 0;
    state.challengeQIdx = 0;
    state.challengeAnswers = [];
    state.replyJa = ""; state.replyEn = ""; state.replyError = "";
    state.challengeLoading = false;
    stopLoadingTipLoop();
    state.phase = "challenge_ringing";
  } catch (e) {
    state.challengeError = e.message;
    state.challengeLoading = false;
    stopLoadingTipLoop();
  }
  render();
}

function answerCall() { state.phase = "challenge_playing"; render(); playChallengeAudio(); }

let audioEl = null;
function playChallengeAudio() {
  if (!state.challengeAudioUrl) return;
  const isResume = audioEl && audioEl.src === state.challengeAudioUrl && audioEl.paused && !audioEl.ended;
  if (!isResume) {
    if (state.phase !== "challenge_result" && state.challengePlaysUsed >= 2) return;
    if (state.phase !== "challenge_result") state.challengePlaysUsed += 1;
  }
  smartPlay(state.challengeAudioUrl, true);
}

function goToChallengeQuestions() { state.phase = "challenge_questions"; state.challengeAnswered = false; state.challengeQFeedback = ""; render(); }

function answerChallengeQuestion(optIdx) {
  if (state.challengeAnswered) return;
  const q = state.challengeData.questions[state.challengeQIdx];
  const correct = optIdx === q.correctIndex;
  state.challengeAnswers.push(correct);
  state.challengeAnswered = true;

  if (q.isAction) {
    // 対応フレーズ問題は解説を読む時間が必要なので、手動で「次へ」を押すまで進めない
    state.challengeQFeedback = (correct ? "✓ 良い対応です。" : "△ 別の言い方もあります。") + (q.note ? "　" + q.note : "");
    render();
  } else {
    // 通常の内容確認問題はテンポよく自動で次へ
    state.challengeQFeedback = "";
    render();
    setTimeout(() => { proceedToNextQuestion(); }, 350);
  }
}

function proceedToNextQuestion() {
  state.challengeQFeedback = "";
  state.challengeAnswered = false;
  if (state.challengeQIdx + 1 < state.challengeData.questions.length) {
    state.challengeQIdx += 1;
    render();
  } else {
    state.phase = "challenge_reply";
    render();
  }
}

async function translateReply() {
  const ta = document.getElementById("replyJaInput");
  const ja = ta ? ta.value.trim() : "";
  if (!ja) return;
  state.replyJa = ja;
  state.replyLoading = true;
  state.replyError = "";
  render();
  const prompt = `次の日本語を、電話口で使う自然な話し言葉の英語に翻訳してください。丁寧すぎる文語ではなく、実際に電話で使えるカジュアルすぎない自然な言い方にしてください。日本語:「${ja}」\n\n出力形式（JSONのみ）:\n{ "en": "英語の翻訳" }`;
  try {
    const parsed = await callGeminiJSON(prompt, 0.7);
    state.replyEn = parsed.en || "";
    if (!state.replyEn) throw new Error("翻訳結果が空でした");
    state.replyPronounceCount = 0;
    state.replyAttemptMsg = "";
    const voice = pickVoiceForAccent("American", "female");
    if (voice) {
      try { state.replyAudioUrl = await generateTTS(state.replyEn, voice); } catch(e) {}
    }
  } catch (e) {
    state.replyError = e.message;
  }
  state.replyLoading = false;
  render();
}

function playReplyAudio() {
  smartPlay(state.replyAudioUrl, false);
}

function smartPlay(url, trackSpeaking) {
  if (!url) return false;
  const resuming = audioEl && audioEl.src === url && audioEl.paused && !audioEl.ended;
  if (resuming) {
    audioEl.playbackRate = state.audioRate;
    audioEl.play();
    return true;
  }
  if (audioEl) audioEl.pause();
  audioEl = new Audio(url);
  audioEl.playbackRate = state.audioRate;
  if (trackSpeaking) {
    audioEl.onplay = () => { state.speaking = true; render(); };
    audioEl.onended = () => { state.speaking = false; render(); };
  }
  audioEl.play();
  if (trackSpeaking) render();
  return false;
}

function pauseCurrentAudio() {
  if (audioEl) { audioEl.pause(); state.speaking = false; render(); }
}

function setAudioRate(rate) {
  state.audioRate = rate;
  if (audioEl) audioEl.playbackRate = rate;
  render();
}

function renderAudioControls() {
  return `
    <div class="audio-controls">
      <button class="secondary" style="width:auto; padding:8px 14px;" onclick="pauseCurrentAudio()">⏸ 止める</button>
      <button class="secondary ${state.audioRate===0.7?'rate-active':''}" style="width:auto; padding:8px 14px;" onclick="setAudioRate(0.7)">ゆっくり</button>
      <button class="secondary ${state.audioRate===1?'rate-active':''}" style="width:auto; padding:8px 14px;" onclick="setAudioRate(1)">通常</button>
    </div>
  `;
}

function startReplyPronounceAttempt() {
  if (state.replyListening) return;
  if (state.replyUseSelfReport) { registerReplyPronounceResult(true, "（自己申告）"); return; }
  const target = state.replyEn;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { registerReplyPronounceResult(true, "（自己申告）"); return; }
  let rec;
  try { rec = new SR(); } catch (e) { registerReplyPronounceResult(true, "（自己申告）"); return; }
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  state.replyListening = true;
  state.replyAttemptMsg = "聞いています…";
  render();
  let handled = false;
  rec.onresult = (e) => {
    handled = true;
    state.replyRecFailStreak = 0;
    const said = e.results[0][0].transcript;
    const ratio = wordOverlapRatio(target, said);
    registerReplyPronounceResult(ratio >= 0.34, said);
  };
  rec.onerror = () => {
    if (handled) return;
    handled = true;
    state.replyListening = false;
    state.replyRecFailStreak += 1;
    if (state.replyRecFailStreak >= 2) {
      state.replyUseSelfReport = true;
      state.replyAttemptMsg = "音声認識がうまく動かないため、次からはタップでカウントする方式に切り替えます";
    } else {
      state.replyAttemptMsg = "うまく聞き取れませんでした。もう一度どうぞ";
    }
    render();
  };
  rec.onend = () => { state.replyListening = false; if (!handled) render(); };
  try { rec.start(); } catch (e) { registerReplyPronounceResult(true, "（自己申告）"); }
}

function registerReplyPronounceResult(pass, said) {
  state.replyListening = false;
  if (pass) {
    state.replyPronounceCount = Math.min(state.replyPronounceTotal, state.replyPronounceCount + 1);
    state.replyAttemptMsg = "✓ OK（" + state.replyPronounceCount + "/" + state.replyPronounceTotal + "）";
  } else {
    state.replyAttemptMsg = "✕ もう一度お願いします（聞こえた: " + (said || "…") + "）";
  }
  render();
}

// ===== 緊張演出（電子音） =====
function applyMoodMode() {
  const tension = ["boss_intro","boss_question","boss_speak","boss_directive"].includes(state.phase);
  const morning = !tension && ["challenge_intro","challenge_ringing","challenge_playing","challenge_questions","challenge_reply","cheatsheet","cheatsheet_ring","recording","recording_playback","challenge_result"].includes(state.phase);
  const night = ["night_intro","night_message","night_done"].includes(state.phase);

  document.body.classList.toggle("tension-mode", tension);
  document.body.classList.toggle("morning-mode", morning);
  document.body.classList.toggle("night-mode", night);

  if (tension) { startAmbient("tick"); } else if (night) { startAmbient("chime"); } else { stopAmbient(); }
}

// ===== 環境音（電子音でループ） =====
function startAmbient(kind) {
  if (state.ambientKind === kind && state.ambientInterval) return;
  stopAmbient();
  try {
    if (!state.tickAudioCtx) state.tickAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = state.tickAudioCtx;
    state.ambientKind = kind;
    if (kind === "tick") {
      state.ambientInterval = setInterval(() => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.frequency.value = 880; osc.type = "square";
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.08);
      }, 800);
    } else if (kind === "chime") {
      const notes = [523.25, 659.25, 784.0]; // C5 E5 G5 の優しい和音を順に
      let i = 0;
      state.ambientInterval = setInterval(() => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.frequency.value = notes[i % notes.length]; osc.type = "sine";
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.025, ctx.currentTime + 0.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.2);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 2.3);
        i++;
      }, 2800);
    }
  } catch (e) {}
}
function stopAmbient() {
  if (state.ambientInterval) { clearInterval(state.ambientInterval); state.ambientInterval = null; }
  state.ambientKind = null;
}
function startTick() { startAmbient("tick"); }
function stopTick() { /* 互換のため残置：全体の停止はstopAmbient() */ stopAmbient(); }

// ===== 怖い上司シーン =====
function goToBossIntro() {
  state.phase = "boss_intro";
  state.bossQIdx = 0;
  render();
  startTick();
}

function goToBossQuestion() {
  state.phase = "boss_question";
  state.bossAnswered = false;
  state.bossFeedback = "";
  render();
}

function answerBossQuestion(idx) {
  if (state.bossAnswered) return;
  const q = state.challengeData.bossQuestions[state.bossQIdx];
  const correct = idx === q.correctIndex;
  state.bossAnswered = true;
  if (correct) {
    state.bossSpeakCount = 0;
    state.bossAttemptMsg = "";
    state.phase = "boss_speak";
    render();
  } else {
    state.bossFeedback = "「違う」と一喝されました。もう一度電話の内容を確認しましょう。";
    render();
  }
}

function retryBossQuestion() {
  state.bossAnswered = false;
  state.bossFeedback = "";
  render();
}

async function playBossTargetAudio() {
  const q = state.challengeData.bossQuestions[state.bossQIdx];
  const target = q.options[q.correctIndex];
  const cacheKey = "boss_" + state.bossQIdx;
  if (!state.bossAudioCache) state.bossAudioCache = {};
  if (state.bossAudioCache[cacheKey]) { smartPlay(state.bossAudioCache[cacheKey], false); return; }
  const voice = pickVoiceForAccent("American");
  if (!voice) return;
  state.bossAudioLoading = true;
  render();
  try {
    const url = await generateTTS(target, voice);
    state.bossAudioCache[cacheKey] = url;
    smartPlay(url, false);
  } catch (e) {}
  state.bossAudioLoading = false;
  render();
}

function startBossSpeakAttempt() {
  if (state.bossListening) return;
  const q = state.challengeData.bossQuestions[state.bossQIdx];
  const target = q.options[q.correctIndex];
  if (state.bossUseSelfReport) { registerBossSpeakResult(true); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { registerBossSpeakResult(true); return; }
  let rec;
  try { rec = new SR(); } catch (e) { registerBossSpeakResult(true); return; }
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  state.bossListening = true;
  state.bossAttemptMsg = "聞いています…";
  render();
  let handled = false;
  rec.onresult = (e) => {
    handled = true;
    state.bossRecFailStreak = 0;
    const said = e.results[0][0].transcript;
    const ratio = wordOverlapRatio(target, said);
    registerBossSpeakResult(ratio >= 0.34, said);
  };
  rec.onerror = () => {
    if (handled) return;
    handled = true;
    state.bossListening = false;
    state.bossRecFailStreak += 1;
    if (state.bossRecFailStreak >= 2) {
      state.bossUseSelfReport = true;
      state.bossAttemptMsg = "音声認識がうまく動かないため、次からはタップでカウントする方式に切り替えます";
    } else {
      state.bossAttemptMsg = "うまく聞き取れませんでした。もう一度どうぞ";
    }
    render();
  };
  rec.onend = () => { state.bossListening = false; if (!handled) render(); };
  try { rec.start(); } catch (e) { registerBossSpeakResult(true); }
}

function registerBossSpeakResult(pass, said) {
  state.bossListening = false;
  if (pass) {
    state.bossSpeakCount = Math.min(state.bossSpeakTotal, state.bossSpeakCount + 1);
    state.bossAttemptMsg = "✓ OK（" + state.bossSpeakCount + "/" + state.bossSpeakTotal + "）";
  } else {
    state.bossAttemptMsg = "✕ もう一度お願いします" + (said ? "（聞こえた: " + said + "）" : "");
  }
  render();
}

function proceedAfterBossSpeak() {
  if (state.bossQIdx + 1 < state.challengeData.bossQuestions.length) {
    state.bossQIdx += 1;
    goToBossQuestion();
  } else {
    stopTick();
    state.phase = "boss_directive";
    render();
  }
}

// ===== 同僚のカンニングペーパー & 折り返し電話 =====
function highlightStress(text, stressWords) {
  let html = text.replace(/</g, "&lt;");
  (stressWords || []).slice().sort((a,b)=>b.length-a.length).forEach(w => {
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("(" + esc + ")", "gi");
    html = html.replace(re, `<span class="stress">$1</span>`);
  });
  return html;
}

async function goToCheatsheet() {
  state.phase = "cheatsheet";
  state.cheatTimer = 60;
  state.callbackAudioUrl = null;
  render();
  if (state.cheatTimerInterval) clearInterval(state.cheatTimerInterval);
  state.cheatTimerInterval = setInterval(() => {
    state.cheatTimer -= 1;
    if (state.cheatTimer <= 0) {
      clearInterval(state.cheatTimerInterval);
      state.cheatTimerInterval = null;
      state.phase = "cheatsheet_ring";
    }
    render();
  }, 1000);
  try {
    const voice = pickVoiceForAccent("American");
    if (voice) state.callbackAudioUrl = await generateTTS(state.challengeData.callbackScript, voice);
  } catch (e) {}
  render();
}

function playCallbackAudio() {
  smartPlay(state.callbackAudioUrl, true);
}

async function startRecordingCall() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    state.challengeError = "この端末・ブラウザでは録音機能が使えないようです。録音なしで進めます。";
    completeWithoutRecording();
    return;
  }
  state.phase = "recording";
  render();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    const mr = new MediaRecorder(stream);
    mr.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(chunks, { type: "audio/webm" });
      state.recordedUrl = URL.createObjectURL(blob);
      stream.getTracks().forEach(t => t.stop());
      state.phase = "recording_playback";
      render();
    };
    state.mediaRecorder = mr;
    state.isRecording = true;
    mr.start();
    render();
  } catch (e) {
    state.challengeError = "";
    completeWithoutRecording();
  }
}

function completeWithoutRecording() {
  state.recordedUrl = null;
  state.phase = "recording_playback";
  render();
}

function stopRecordingCall() {
  if (state.mediaRecorder && state.isRecording) {
    state.isRecording = false;
    state.mediaRecorder.stop();
  }
}

function playRecordedAudio() {
  smartPlay(state.recordedUrl, false);
}

function finishChallenge() {
  const correctCount = state.challengeAnswers.filter(Boolean).length;
  const total = state.challengeData.questions.length;
  const passed = correctCount >= Math.ceil(total * 0.6);
  const entry = { date: todayStr(), callType: state.challengeData.callType, correctCount, total, passed };
  state.challengeLog.unshift(entry);
  localStorage.setItem("challenge_log", JSON.stringify(state.challengeLog));
  state.challengeDate = todayStr();
  localStorage.setItem("challenge_date", state.challengeDate);
  state.phase = "challenge_result";
  render();
}

function resetChallengeForTesting() {
  state.challengeDate = "";
  localStorage.removeItem("challenge_date");
  state.challengeError = "";
  render();
}

function highlightFillers(script, fillers) {
  let html = script.replace(/</g, "&lt;");
  (fillers || []).slice().sort((a,b)=>b.phrase.length-a.phrase.length).forEach(f => {
    const esc = f.phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("(" + esc + ")", "gi");
    html = html.replace(re, `<mark class="filler-mark" title="${(f.note||"").replace(/"/g,"")}">$1</mark>`);
  });
  return html;
}

      <div class="eyebrow">おやすみなさい</div>
      <div class="praise-box">今夜のチャット、お疲れさまでした。ゆっくり休んでください。</div>
      <button class="primary" onclick="goToHub()">ホームへ戻る</button>
    `;
  }
}

render();
</script>
</body>
</html>
