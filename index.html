<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今日の電話チャレンジ</title>
<style>
  :root {
    --bg: #0B1220; --panel: #16202E; --panelAlt: #1C2838;
    --amber: #FFB020; --sky: #5EB1E0; --text: #F2F5F8; --muted: #9FB0C3;
    --success: #34D399; --error: #F87171; --border: #2A3B54;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; background: var(--panelAlt); border-bottom: 1px solid var(--border);
  }
  .gate { font-family: 'Courier New', monospace; color: var(--amber); letter-spacing: 0.1em; font-size: 15px; }
  .content { padding: 26px 22px; max-height: 82vh; overflow-y: auto; }
  .eyebrow {
    font-family: 'Courier New', monospace; color: var(--sky); letter-spacing: 0.15em;
    font-size: 12px; text-transform: uppercase; text-align: center; margin-bottom: 6px;
  }
  h1 { font-size: 24px; line-height: 1.5; margin: 8px 0 14px; }
  .desc { font-size: 16px; color: var(--muted); margin-bottom: 18px; line-height: 1.7; }
  label.field-label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  input[type=text], input[type=password], input[type=number], textarea {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panelAlt); color: var(--text); font-size: 16px; margin-bottom: 14px; font-family: inherit;
  }
  button.primary {
    width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--amber);
    color: var(--bg); font-weight: bold; font-size: 17px; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.4; }
  button.primary:active { transform: scale(0.97); }
  button.secondary {
    width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: 10px;
    background: transparent; color: var(--muted); font-size: 15px; cursor: pointer; margin-top: 10px;
  }
  .provider-item {
    display: flex; align-items: center; gap: 12px; padding: 16px; margin-bottom: 10px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--panelAlt); cursor: pointer;
  }
  .provider-item.selected { border-color: var(--amber); background: rgba(255,176,32,0.1); }
  .provider-name { font-size: 17px; font-weight: bold; }
  .provider-desc { font-size: 13px; color: var(--muted); }
  .provider-block { border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; background: var(--panelAlt); }
  .provider-block h2 { font-size: 15px; margin: 0 0 10px; color: var(--sky); }
  .playbtn {
    width: 104px; height: 104px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 10px; cursor: pointer; background: var(--panelAlt); border: 2px solid var(--amber);
  }
  .playbtn.speaking { background: var(--amber); }
  .repeat { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 auto 24px; font-size: 14px; color: var(--muted); background: none; border: none; cursor: pointer; }
  .option {
    width: 100%; text-align: left; padding: 15px 18px; margin-bottom: 12px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panelAlt); color: var(--text);
    font-size: 17px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  }
  .translation { background: var(--panelAlt); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px; font-size: 16px; text-align: center; color: var(--text); }
  .score { font-size: 44px; font-weight: bold; color: var(--amber); text-align: center; margin: 8px 0; }
  .summary-msg { text-align: center; font-size: 16px; color: var(--muted); margin-bottom: 26px; line-height: 1.7; }
  .voice-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--bg); cursor: pointer;
  }
  .voice-item.selected { border-color: var(--amber); background: rgba(255,176,32,0.1); }
  .voice-item input { width: 18px; height: 18px; flex-shrink: 0; }
  .voice-name { font-size: 15px; }
  .voice-accent { font-size: 12px; color: var(--muted); }
  .voice-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; background: var(--border); color: var(--muted); vertical-align: middle; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--amber); border-radius: 50%; margin: 20px auto; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: rgba(248,113,113,0.1); border: 1px solid var(--error); border-radius: 10px; padding: 14px; font-size: 14px; color: var(--error); margin-bottom: 16px; }
  .tip { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 14px; }
  svg { display: block; }
  .call-card { background: var(--panelAlt); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .call-type { font-size: 13px; color: var(--sky); margin-bottom: 4px; }
  .call-desc { font-size: 15px; color: var(--muted); line-height: 1.6; }
  .phone-ring { width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 20px auto; background: var(--panelAlt); border: 3px solid var(--amber); animation: ringpulse 1s infinite; cursor: pointer; }
  @keyframes ringpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .plays-left { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .qcounter { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .log-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panelAlt); margin-bottom: 8px; font-size: 14px; }
  .log-date { color: var(--muted); font-size: 12px; }
  .log-result { font-weight: bold; }
  .log-result.ok { color: var(--success); }
  .log-result.ng { color: var(--error); }
  .stat-row { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; }
  .stat-num { font-size: 28px; font-weight: bold; color: var(--amber); text-align: center; }
  .stat-label { font-size: 11px; color: var(--muted); text-align: center; }
  .filler-mark { background: rgba(255,176,32,0.22); color: var(--amber); padding: 0 3px; border-radius: 3px; cursor: help; }
  .memo-box { background: var(--panelAlt); border: 1px dashed var(--sky); border-radius: 10px; padding: 14px; margin-bottom: 16px; font-size: 14px; }
  .memo-box b { color: var(--text); }
  .filler-list { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.8; }
  .filler-list .fp { color: var(--amber); font-weight: bold; }
  .qfeedback { text-align: center; font-size: 14px; color: var(--sky); margin-top: 12px; line-height: 1.6; }
  .reply-en { background: var(--panelAlt); border: 1px solid var(--success); border-radius: 12px; padding: 16px; margin-bottom: 16px; font-size: 17px; color: var(--success); }
  .pronounce-title { text-align: center; font-size: 15px; color: var(--text); margin-bottom: 14px; font-weight: bold; }
  .pdots { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .pdot { width: 16px; height: 16px; border-radius: 50%; background: var(--border); transition: background 0.25s, transform 0.25s; }
  .pdot.done { background: var(--amber); transform: scale(1.15); }
  .micbtn {
    width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px; cursor: pointer; background: var(--panelAlt); border: 2px solid var(--sky);
  }
  .micbtn.listening { background: var(--sky); }
  .attempt-msg { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 18px; min-height: 20px; }
  body.tension-mode { background: #1a0508; }
  body.tension-mode .card { border-color: #ff4d4d; box-shadow: 0 0 50px rgba(255,60,60,0.35); }
  body.tension-mode .header { background: #2a0b0e; border-color: #ff4d4d; }
  body.tension-mode .gate { color: #ff6b6b; }
  body.tension-mode .eyebrow { color: #ff8080; }
  body.tension-mode .playbtn, body.tension-mode .micbtn { border-color: #ff4d4d; }
  body.tension-mode .playbtn.speaking, body.tension-mode .micbtn.listening { background: #ff4d4d; }
  body.tension-mode button.primary { background: #ff4d4d; color: #fff; }
  body.tension-mode .pdot.done { background: #ff4d4d; }
  .boss-card { background: #2a0b0e; border: 1px solid #ff4d4d; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .boss-name { font-size: 13px; color: #ff8080; margin-bottom: 6px; letter-spacing: 0.1em; }
  .boss-line { font-size: 19px; color: var(--text); line-height: 1.6; font-weight: bold; }
  .cheat-card { background: var(--panelAlt); border: 2px dashed var(--sky); border-radius: 12px; padding: 20px; margin-bottom: 18px; font-size: 17px; line-height: 1.8; }
  .timer-big { font-size: 56px; font-weight: bold; text-align: center; color: var(--amber); margin: 10px 0 20px; font-family: 'Courier New', monospace; }
  .praise-box { background: var(--panelAlt); border: 1px solid var(--success); border-radius: 12px; padding: 18px; margin-bottom: 16px; font-size: 16px; color: var(--text); line-height: 1.7; text-align: center; }
  .audio-controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .rate-active { border-color: var(--amber) !important; color: var(--amber) !important; }
  .stress { font-weight: 900; color: var(--amber); text-decoration: underline; text-underline-offset: 3px; }
  .hardword-list { background: var(--panelAlt); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; font-size: 13px; color: var(--muted); line-height: 1.9; }
  .hardword-list b { color: var(--sky); }
  .hub-card {
    display: flex; align-items: center; justify-content: space-between; padding: 18px;
    border-radius: 14px; border: 1px solid var(--border); background: var(--panelAlt); margin-bottom: 14px; cursor: pointer;
  }
  .hub-card.available { border-color: var(--amber); background: rgba(255,176,32,0.08); }
  .hub-card.done { opacity: 0.5; }
  .hub-card.locked { opacity: 0.55; }
  .hub-title { font-size: 17px; font-weight: bold; margin-bottom: 4px; }
  .hub-sub { font-size: 12px; color: var(--muted); }
  .hub-status { font-size: 20px; }
  .signal-mark { background: rgba(94,177,224,0.22); color: var(--sky); padding: 0 3px; border-radius: 3px; }
  .night-card { background: linear-gradient(160deg, #1c1830, #16202E); border: 1px solid #7c6cff; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .night-name { font-size: 20px; font-weight: bold; color: #b6a8ff; margin-bottom: 6px; }
  .night-line { font-size: 17px; line-height: 1.7; color: var(--text); }
</style>
</head>

<script>
function normalize(s) { return (s || "").toLowerCase().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim(); }
function wordOverlapRatio(target, said) {
  const t = normalize(target).split(" ").filter(Boolean);
  const sSet = new Set(normalize(said).split(" ").filter(Boolean));
  if (t.length === 0) return 0;
  let match = 0;
  t.forEach(w => { if (sSet.has(w)) match += 1; });
  return match / t.length;
}
function hexToBlobUrl(hex, mime) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  return URL.createObjectURL(new Blob([bytes], { type: mime }));
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

const CALL_TYPES_BASE = [
  "見知らぬ会社からの営業電話",
  "Facebook広告サポートからの電話",
  "取次ぎ依頼の電話（担当者宛て）",
  "実際の顧客からの商品についての問い合わせ電話",
  "海外の仕入れ先からの出荷や請求書に関する電話",
  "配送業者や通関に関する電話",
  "近隣（六本木・麻布十番エリア）の店舗オーナーやレストランからの内装照明の問い合わせ電話",
  "この地域に住む外国人（大使館関係者の家族など）からの個人的な照明購入の問い合わせ電話",
  "全く関係ない会社・部署宛ての間違い電話",
  "いたずら電話っぽい、要領を得ない電話（子どもなど）"
];

let state = {
  phase: "provider",
  useElevenLabs: true,
  useMiniMax: false,
  elevenApiKey: localStorage.getItem("el_api_key") || "",
  minimaxApiKey: localStorage.getItem("mm_api_key") || "",
  minimaxGroupId: localStorage.getItem("mm_group_id") || "",
  geminiApiKey: localStorage.getItem("gemini_api_key") || "",
  availableVoices: [],

  companyFetchError: "",

  companyCharacters: JSON.parse(localStorage.getItem("company_characters") || "null") || [
    { name: "森さん", role: "社長" },
    { name: "品川さん", role: "英語対応の担当者（普段電話を受ける人）" }
  ],

  challengeData: null,

  challengeError: "",

  challengeAnswers: [],

  speaking: false,

  replyJa: "",
  replyEn: "",

  replyPronounceCount: 0,

  replyListening: false,
  replyAttemptMsg: "",
  replyRecFailStreak: 0,
  replyUseSelfReport: false,
  bossQIdx: 0,
  bossAnswered: false,
  bossFeedback: "",

  bossListening: false,
  bossAttemptMsg: "",
  bossRecFailStreak: 0,
  bossUseSelfReport: false,

  tickAudioCtx: null,

  callbackAudioUrl: null,
  // 昼：メールのトーン判定
  middayDate: localStorage.getItem("midday_date") || "",
  middayLog: JSON.parse(localStorage.getItem("midday_log") || "[]"),
  mailData: null,
  mailLoading: false,

  // 夜：癒しの時間（固定キャラクター）
  nightDate: localStorage.getItem("night_date") || "",
  nightLog: JSON.parse(localStorage.getItem("night_log") || "[]"),

const NIGHT_CHARACTERS = [
  { id: "ray",    name: "レイ",     role: "彼氏（台湾出身・アメリカ留学経験、今は台湾在住）", accentHint: "American", gender: "male",   relation: "boyfriend" },
  { id: "laura",  name: "ローラ",   role: "友人（カリフォルニア在住、昔ホームステイを受け入れた家庭の娘）", accentHint: "American", gender: "female", relation: "friend" },
  { id: "yuna",   name: "ユナ",     role: "友人（台湾人、夫の仕事で中国に駐在中）", accentHint: "Chinese", gender: "female", relation: "friend" },
  { id: "usuda",  name: "薄田さん", role: "友人（夫の仕事でシンガポールに駐在中の日本人）", accentHint: "Singapore", gender: "female", relation: "friend" },
];

function voiceKey(v) { return v.provider + "::" + v.voice_id; }

function buildCompanyContext() {
  const chars = state.companyCharacters.filter(c => c.name && c.role).map(c => `${c.name}（${c.role}）`).join("、");
  let ctx = `このアプリのユーザーは日本の会社に勤めています。登場人物: ${chars || "特に設定なし"}。英語対応は通常${state.companyCharacters[1] ? state.companyCharacters[1].name : "担当者"}が行いますが、不在のときはユーザー自身が電話に対応しなければなりません。`;
  if (state.companyExtraInfo) ctx += `\n会社の商品・取引先・専門用語・地域性などの情報: ${state.companyExtraInfo}`;
  if (state.companySiteText) ctx += `\n会社サイトから取得した情報（参考程度に、実在しそうな商品名・型番・メーカー名などを電話の内容に自然に盛り込んでください）:\n${state.companySiteText.slice(0, 3000)}`;
  return ctx;
}

function toggleProvider(p) {
  if (p === "eleven") state.useElevenLabs = !state.useElevenLabs;
  if (p === "minimax") state.useMiniMax = !state.useMiniMax;
  render();
}

function goToCredentials() {
  if (!state.useElevenLabs && !state.useMiniMax) return;
  state.phase = "credentials";
  render();
}

async function fetchAllVoicesAndProceed() {
  state.elevenApiKey = (document.getElementById("elevenKeyInput") || {}).value?.trim() || state.elevenApiKey;
  state.minimaxApiKey = (document.getElementById("minimaxKeyInput") || {}).value?.trim() || state.minimaxApiKey;
  state.minimaxGroupId = (document.getElementById("minimaxGroupInput") || {}).value?.trim() || state.minimaxGroupId;
  if (state.useElevenLabs && !state.elevenApiKey) { state.errorMsg = "ElevenLabsのAPIキーを入力してください"; render(); return; }
  if (state.useMiniMax && (!state.minimaxApiKey || !state.minimaxGroupId)) { state.errorMsg = "MiniMaxのAPIキーとGroupIDを入力してください"; render(); return; }
  localStorage.setItem("el_api_key", state.elevenApiKey);
  localStorage.setItem("mm_api_key", state.minimaxApiKey);
  localStorage.setItem("mm_group_id", state.minimaxGroupId);

  state.phase = "voices";
  state.errorMsg = "";
  state.availableVoices = [];
  render();

  try {
    if (state.useElevenLabs) {
      const res = await fetch("https://api.elevenlabs.io/v1/voices", { headers: { "xi-api-key": state.elevenApiKey } });
      if (!res.ok) throw new Error("ElevenLabs: APIキーが正しくないか接続に失敗しました（status " + res.status + "）");
      const data = await res.json();
      (data.voices || []).forEach(v => {
        state.availableVoices.push({
          provider: "eleven", voice_id: v.voice_id, name: v.name,
          accent: (v.labels && (v.labels.accent || v.labels.description)) || "アクセント情報なし",
          gender: (v.labels && v.labels.gender) || null
        });
      });
    }
    if (state.useMiniMax) {
      const res = await fetch(`https://api.minimax.io/v1/get_voice?GroupId=${encodeURIComponent(state.minimaxGroupId)}`, {
        method: "POST", headers: { "Authorization": "Bearer " + state.minimaxApiKey, "Content-Type": "application/json" },
        body: JSON.stringify({ voice_type: "system" })
      });
      if (!res.ok) throw new Error("MiniMax: APIキー/GroupIDが正しくないか接続に失敗しました（status " + res.status + "）");
      const data = await res.json();
      (data.system_voice || []).slice(0, 40).forEach(v => {
        const descText = ((v.description && v.description.join(" ")) || "").toLowerCase();
        let guessedGender = null;
        if (/\b(female|woman|girl|she|her)\b/.test(descText)) guessedGender = "female";
        else if (/\b(male|man|boy|he|his)\b/.test(descText)) guessedGender = "male";
        state.availableVoices.push({
          provider: "minimax", voice_id: v.voice_id, name: v.voice_name || v.voice_id,
          accent: (v.description && v.description[0]) || "説明なし",
          gender: guessedGender
        });
      });
    }
  } catch (e) {
    state.errorMsg = e.message;
    state.phase = "credentials";
    render();
    return;
  }

  state.selectedVoiceIds = state.availableVoices.map(voiceKey);
  state.phase = "voices";
  render();
}

function toggleVoice(key) {
  const i = state.selectedVoiceIds.indexOf(key);
  if (i >= 0) state.selectedVoiceIds.splice(i, 1);
  else state.selectedVoiceIds.push(key);
  render();
}

function getVoiceByKey(key) { return state.availableVoices.find(v => voiceKey(v) === key); }

function confirmVoices() {
  if (state.selectedVoiceIds.length < 1) return;
  state.phase = "hub";
  render();
}

function getNow() {
  const d = new Date();
  return { h: d.getHours(), m: d.getMinutes() };
}
function minutesOfDay(h, m) { return h * 60 + m; }
function inWindow(startH, startM, endH, endM) {
  const now = getNow();
  const cur = minutesOfDay(now.h, now.m);
  return cur >= minutesOfDay(startH, startM) && cur <= minutesOfDay(endH, endM);
}

function middayInWindow() { return inWindow(13, 0, 15, 0); }

async function generateTTS(text, voice) {
  if (voice.provider === "eleven") {
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice.voice_id}`, {
      method: "POST",
      headers: { "xi-api-key": state.elevenApiKey, "Content-Type": "application/json", "Accept": "audio/mpeg" },
      body: JSON.stringify({ text, model_id: "eleven_flash_v2_5" })
    });
    if (!res.ok) throw new Error("ElevenLabs音声生成に失敗しました（status " + res.status + "）");
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  } else {
    const res = await fetch(`https://api.minimax.io/v1/t2a_v2?GroupId=${encodeURIComponent(state.minimaxGroupId)}`, {
      method: "POST",
      headers: { "Authorization": "Bearer " + state.minimaxApiKey, "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "speech-2.6-hd", text, stream: false, language_boost: "English",
        voice_setting: { voice_id: voice.voice_id, speed: 0.95, vol: 1.0, pitch: 0 },
        audio_setting: { sample_rate: 32000, bitrate: 128000, format: "mp3", channel: 1 }
      })
    });
    if (!res.ok) throw new Error("MiniMax音声生成に失敗しました（status " + res.status + "）");
    const data = await res.json();
    const hex = data.data && data.data.audio;
    if (!hex) throw new Error("MiniMaxから音声データが返りませんでした");
    return hexToBlobUrl(hex, "audio/mpeg");
  }
}

function normalizeGenderHint(g) {
  if (!g) return null;
  const s = String(g).toLowerCase();
  if (/女|female|woman|girl/.test(s)) return "female";
  if (/男|male|man|boy/.test(s)) return "male";
  return null;
}

function pickVoiceForAccent(hint, genderHint) {
  const pool = state.selectedVoiceIds.map(getVoiceByKey).filter(Boolean);
  if (pool.length === 0) return null;
  const wantGender = normalizeGenderHint(genderHint);
  const genderPool = wantGender ? pool.filter(v => v.gender === wantGender) : [];
  const searchPools = genderPool.length > 0 ? [genderPool, pool] : [pool];

  if (hint) {
    const kwSets = [
      { test: /india|インド/i, kw: ["india","indian"] },
      { test: /british|england|uk|イギリス/i, kw: ["british","uk","england"] },
      { test: /french|フランス/i, kw: ["french"] },
      { test: /american|アメリカ/i, kw: ["american","us"] },
      { test: /singapore|シンガポール/i, kw: ["singapore"] },
      { test: /australia|オーストラリア/i, kw: ["australia"] },
      { test: /chinese|china|中国/i, kw: ["chinese","china"] },
    ];
    for (const searchPool of searchPools) {
      for (const set of kwSets) {
        if (set.test.test(hint)) {
          for (const k of set.kw) {
            const match = searchPool.find(v => (v.accent||"").toLowerCase().includes(k) || (v.name||"").toLowerCase().includes(k));
            if (match) return match;
          }
        }
      }
    }
  }
  // アクセント一致がなければ、性別だけでも合わせる
  if (genderPool.length > 0) return genderPool[Math.floor(Math.random() * genderPool.length)];
  return pool[Math.floor(Math.random() * pool.length)];
}

async function callGeminiJSON(prompt, temperature) {
  let modelsToTry = ["gemini-2.5-flash", "gemini-flash-latest", "gemini-2.0-flash", "gemini-1.5-flash"];
  try {
    const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(state.geminiApiKey)}`);
    if (listRes.ok) {
      const listData = await listRes.json();
      const usable = (listData.models || [])
        .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes("generateContent"))
        .map(m => m.name.replace(/^models\//, ""));
      if (usable.length > 0) modelsToTry = usable.filter(n => /flash/i.test(n)).concat(usable.filter(n => !/flash/i.test(n)));
    }
  } catch (e) {}

  let res = null, lastStatus = null;
  outerG:
  for (const modelName of modelsToTry) {
    for (let attempt = 0; attempt < 3; attempt++) {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(state.geminiApiKey)}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: temperature } })
      });
      if (res.ok) break outerG;
      lastStatus = res.status;
      if (res.status === 503 || res.status === 429) { await new Promise(r => setTimeout(r, 1500 * (attempt+1))); continue; }
      break;
    }
    if (res && res.ok) break;
  }
  if (!res || !res.ok) throw new Error("Gemini APIエラー（status " + lastStatus + "）");
  const data = await res.json();
  let text = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
  if (!text) throw new Error("応答が空でした");
  text = text.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  return JSON.parse(text);
}

  "callerCompany": "会社名（なければ空文字）",
  "callerAccent": "アクセントのヒント",
  "callerGender": "male または female",
  "script": "電話の英文全体（1つの文字列）",
  "ja": "scriptの全文を、省略せず自然な日本語に翻訳したもの（要約ではなく全文訳）",
  "fillers": [ { "phrase": "you know", "note": "特に意味はない口癖" } ],
  "questions": [ { "q": "設問", "options": ["a","b","c"], "correctIndex": 0 } ],
  "actionQuestion": { "situation": "状況説明", "options": ["a","b","c"], "correctIndex": 0, "note": "解説" },
  "bossQuestions": [
    { "q": "上司の日本語のセリフ1", "options": ["English sentence A","English sentence B","English sentence C"], "correctIndex": 0, "hardWords": [] },
    { "q": "上司の日本語のセリフ2", "options": ["English sentence A","English sentence B","English sentence C"], "correctIndex": 0, "hardWords": [] }
  ],
  "callbackScript": "折り返し電話で読み上げる長めの英文",
  "callbackStressWords": ["word1","word2"],
  "callbackHardWords": [ { "word": "reschedule", "ipa": "riːˈskɛdʒuːl", "ja": "予定を変更する" } ]
}`;

  try {
    const parsed = await callGeminiJSON(prompt, 1.05);
    if (!parsed.script || !Array.isArray(parsed.questions) || parsed.questions.length === 0) throw new Error("生成内容が不完全でした。もう一度お試しください");

    parsed.fillers = (Array.isArray(parsed.fillers) ? parsed.fillers : []).filter(f =>
      f && f.phrase && parsed.script.toLowerCase().includes(String(f.phrase).toLowerCase())
    ).slice(0, 4);

    if (parsed.actionQuestion && Array.isArray(parsed.actionQuestion.options)) {
      parsed.questions.push({
        q: parsed.actionQuestion.situation || "内容がよく理解できなかったとき、電話で何と言いますか？",
        options: parsed.actionQuestion.options,
        correctIndex: parsed.actionQuestion.correctIndex || 0,
        note: parsed.actionQuestion.note || "",
        isAction: true
      });
    }

    if (!Array.isArray(parsed.bossQuestions) || parsed.bossQuestions.length === 0) {
      parsed.bossQuestions = [
        { q: "今の電話、何だったの？", options: [parsed.ja.split("。")[0] || "It was a customer inquiry.", "It was a wrong number.", "It was a delivery problem."], correctIndex: 0 }
      ];
    }
    if (!parsed.callbackScript) {
      parsed.callbackScript = "Hello, this is calling back regarding your earlier call. I'm sorry I couldn't answer at that time. Could you tell me a bit more about what you need? I'll make sure to follow up as soon as possible. Thank you for your patience.";
    }
    if (!Array.isArray(parsed.callbackStressWords)) parsed.callbackStressWords = [];
    if (!Array.isArray(parsed.callbackHardWords)) parsed.callbackHardWords = [];

    const voice = pickVoiceForAccent(parsed.callerAccent, parsed.callerGender);
    if (!voice) throw new Error("使える声がありません");
    const audioUrl = await generateTTS(parsed.script, voice);

    state.challengeData = parsed;
    state.challengeAudioUrl = audioUrl;
    state.challengePlaysUsed = 0;
    state.challengeQIdx = 0;
    state.challengeAnswers = [];
    state.replyJa = ""; state.replyEn = ""; state.replyError = "";
    state.challengeLoading = false;
    state.phase = "challenge_ringing";
  } catch (e) {
    state.challengeError = e.message;
    state.challengeLoading = false;
  }
  render();
}

function answerCall() { state.phase = "challenge_playing"; render(); playChallengeAudio(); }

let audioEl = null;
function playChallengeAudio() {
  if (!state.challengeAudioUrl) return;
  const isResume = audioEl && audioEl.src === state.challengeAudioUrl && audioEl.paused && !audioEl.ended;
  if (!isResume) {
    if (state.phase !== "challenge_result" && state.challengePlaysUsed >= 2) return;
    if (state.phase !== "challenge_result") state.challengePlaysUsed += 1;
  }
  smartPlay(state.challengeAudioUrl, true);
}

function goToChallengeQuestions() { state.phase = "challenge_questions"; state.challengeAnswered = false; state.challengeQFeedback = ""; render(); }

function answerChallengeQuestion(optIdx) {
  if (state.challengeAnswered) return;
  const q = state.challengeData.questions[state.challengeQIdx];
  const correct = optIdx === q.correctIndex;
  state.challengeAnswers.push(correct);
  state.challengeAnswered = true;

  if (q.isAction) {
    // 対応フレーズ問題は解説を読む時間が必要なので、手動で「次へ」を押すまで進めない
    state.challengeQFeedback = (correct ? "✓ 良い対応です。" : "△ 別の言い方もあります。") + (q.note ? "　" + q.note : "");
    render();
  } else {
    // 通常の内容確認問題はテンポよく自動で次へ
    state.challengeQFeedback = "";
    render();
    setTimeout(() => { proceedToNextQuestion(); }, 350);
  }
}

function proceedToNextQuestion() {
  state.challengeQFeedback = "";
  state.challengeAnswered = false;
  if (state.challengeQIdx + 1 < state.challengeData.questions.length) {
    state.challengeQIdx += 1;
    render();
  } else {
    state.phase = "challenge_reply";
    render();
  }
}

async function translateReply() {

function playReplyAudio() {

function smartPlay(url, trackSpeaking) {
  if (!url) return false;
  const resuming = audioEl && audioEl.src === url && audioEl.paused && !audioEl.ended;
  if (resuming) {
    audioEl.playbackRate = state.audioRate;
    audioEl.play();
    return true;
  }
  if (audioEl) audioEl.pause();
  audioEl = new Audio(url);
  audioEl.playbackRate = state.audioRate;
  if (trackSpeaking) {
    audioEl.onplay = () => { state.speaking = true; render(); };
    audioEl.onended = () => { state.speaking = false; render(); };
  }
  audioEl.play();
  if (trackSpeaking) render();
  return false;
}

function pauseCurrentAudio() {
  if (audioEl) { audioEl.pause(); state.speaking = false; render(); }
}

function setAudioRate(rate) {
  state.audioRate = rate;
  if (audioEl) audioEl.playbackRate = rate;
  render();
}

function renderAudioControls() {
  return `
    <div class="audio-controls">
      <button class="secondary" style="width:auto; padding:8px 14px;" onclick="pauseCurrentAudio()">⏸ 止める</button>
      <button class="secondary ${state.audioRate===0.7?'rate-active':''}" style="width:auto; padding:8px 14px;" onclick="setAudioRate(0.7)">ゆっくり</button>
      <button class="secondary ${state.audioRate===1?'rate-active':''}" style="width:auto; padding:8px 14px;" onclick="setAudioRate(1)">通常</button>
    </div>
  `;
}

function startReplyPronounceAttempt() {
  if (state.replyListening) return;
  if (state.replyUseSelfReport) { registerReplyPronounceResult(true, "（自己申告）"); return; }
  const target = state.replyEn;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { registerReplyPronounceResult(true, "（自己申告）"); return; }
  let rec;
  try { rec = new SR(); } catch (e) { registerReplyPronounceResult(true, "（自己申告）"); return; }
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  state.replyListening = true;
  state.replyAttemptMsg = "聞いています…";
  render();
  let handled = false;
  rec.onresult = (e) => {
    handled = true;
    state.replyRecFailStreak = 0;
    const said = e.results[0][0].transcript;
    const ratio = wordOverlapRatio(target, said);
    registerReplyPronounceResult(ratio >= 0.34, said);
  };
  rec.onerror = () => {
    if (handled) return;
    handled = true;
    state.replyListening = false;
    state.replyRecFailStreak += 1;
    if (state.replyRecFailStreak >= 2) {
      state.replyUseSelfReport = true;
      state.replyAttemptMsg = "音声認識がうまく動かないため、次からはタップでカウントする方式に切り替えます";
    } else {
      state.replyAttemptMsg = "うまく聞き取れませんでした。もう一度どうぞ";
    }
    render();
  };
  rec.onend = () => { state.replyListening = false; if (!handled) render(); };
  try { rec.start(); } catch (e) { registerReplyPronounceResult(true, "（自己申告）"); }
}

function registerReplyPronounceResult(pass, said) {
  state.replyListening = false;
  if (pass) {
    state.replyPronounceCount = Math.min(state.replyPronounceTotal, state.replyPronounceCount + 1);
    state.replyAttemptMsg = "✓ OK（" + state.replyPronounceCount + "/" + state.replyPronounceTotal + "）";
  } else {
    state.replyAttemptMsg = "✕ もう一度お願いします（聞こえた: " + (said || "…") + "）";
  }
  render();
}

// ===== 緊張演出（電子音） =====
function startTick() {
  try {
    if (!state.tickAudioCtx) state.tickAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (state.tickInterval) return;
    state.tickInterval = setInterval(() => {
      const ctx = state.tickAudioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      osc.type = "square";
      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.08);
    }, 800);
  } catch (e) {}
}
function stopTick() {
  if (state.tickInterval) { clearInterval(state.tickInterval); state.tickInterval = null; }
}
function applyTensionMode() {
  const tension = ["boss_intro","boss_question","boss_speak","boss_directive"].includes(state.phase);
  document.body.classList.toggle("tension-mode", tension);
}

    const said = e.results[0][0].transcript;
    const ratio = wordOverlapRatio(target, said);
    registerBossSpeakResult(ratio >= 0.34, said);
  };
  rec.onerror = () => {
    if (handled) return;

    state.bossListening = false;

function registerBossSpeakResult(pass, said) {
  state.bossListening = false;

function proceedAfterBossSpeak() {

// ===== 同僚のカンニングペーパー & 折り返し電話 =====
function highlightStress(text, stressWords) {
  let html = text.replace(/</g, "&lt;");
  (stressWords || []).slice().sort((a,b)=>b.length-a.length).forEach(w => {
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("(" + esc + ")", "gi");
    html = html.replace(re, `<span class="stress">$1</span>`);
  });
  return html;
}

async function goToCheatsheet() {
  state.phase = "cheatsheet";
  state.cheatTimer = 60;
  state.callbackAudioUrl = null;
  render();
  if (state.cheatTimerInterval) clearInterval(state.cheatTimerInterval);
  state.cheatTimerInterval = setInterval(() => {
    state.cheatTimer -= 1;
    if (state.cheatTimer <= 0) {
      clearInterval(state.cheatTimerInterval);
      state.cheatTimerInterval = null;
      state.phase = "cheatsheet_ring";
    }
    render();
  }, 1000);
  try {
    const voice = pickVoiceForAccent("American");
    if (voice) state.callbackAudioUrl = await generateTTS(state.challengeData.callbackScript, voice);
  } catch (e) {}
  render();
}

function playCallbackAudio() {
  smartPlay(state.callbackAudioUrl, true);
}

async function startRecordingCall() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    state.challengeError = "この端末・ブラウザでは録音機能が使えないようです。録音なしで進めます。";
    completeWithoutRecording();
    return;
  }
  state.phase = "recording";
  render();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    const mr = new MediaRecorder(stream);
    mr.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(chunks, { type: "audio/webm" });
      state.recordedUrl = URL.createObjectURL(blob);
      stream.getTracks().forEach(t => t.stop());
      state.phase = "recording_playback";
      render();
    };
    state.mediaRecorder = mr;
    state.isRecording = true;
    mr.start();
    render();
  } catch (e) {
    state.challengeError = "";
    completeWithoutRecording();
  }
}

function completeWithoutRecording() {
  state.recordedUrl = null;
  state.phase = "recording_playback";
  render();
}

function stopRecordingCall() {
  if (state.mediaRecorder && state.isRecording) {
    state.isRecording = false;
    state.mediaRecorder.stop();
  }
}

function playRecordedAudio() {
  smartPlay(state.recordedUrl, false);
}

      ${!state.geminiApiKey ? `<label class="field-label">Gemini APIキー（無料・カード不要）</label><input type="password" id="geminiKeyInputMail" placeholder="AIza..." value="" />` : ""}
      ${state.mailLoading
        ? `<div class="spinner"></div><div class="desc" style="text-align:center;">メールを準備中…</div>`
        : doneToday
          ? `<div class="tip">今日の分は完了しました。また明日。</div><button class="secondary" onclick="resetMailForTesting()">（動作確認用）リセットして再挑戦</button>`
          : !inWin
            ? `<div class="tip">今は13:00〜15:00の時間外です。</div><button class="secondary" onclick="startTodayMail()">（動作確認用）時間を無視して試す</button>`
            : `<button class="primary" onclick="startTodayMail()">メールを開く</button>`}
      <button class="secondary" onclick="goToHub()">← ホームへ戻る</button>
      ${logHtml ? `<div class="desc" style="margin-top:20px;">履歴</div>${logHtml}` : ""}
    `;
  } else if (state.phase === "mail_reading") {
    c.innerHTML = `
      <div class="eyebrow">📧 メール受信</div>
      <div class="call-card">
        <div class="call-type">From: ${state.mailData.from}</div>
        <div class="call-type">Subject: ${state.mailData.subject}</div>
        <div class="call-desc" style="margin-top:10px; color:var(--text); font-size:16px; line-height:1.8;">${state.mailData.body}</div>
      </div>
      ${!state.mailReadDone
        ? `<div class="timer-big" style="font-size:40px;">${state.mailTimer}秒</div><div class="desc" style="text-align:center;">読み終わったら次へ進めます</div><button class="secondary" onclick="finishMailReadingEarly()">読み終わった（早める）</button>`
        : `<button class="primary" onclick="goToMailQuestion()">このメールのトーンは？</button>`}
    `;
  } else if (state.phase === "mail_question") {
    c.innerHTML = `
      <div class="eyebrow">このメールはどんなトーン？</div>
      <div class="desc">意味の翻訳ではなく、「どう対応すべきか」を判断してください。</div>
      <div>${state.mailData.toneOptions.map((opt,i)=>{
        let cls = "option";
        if (state.mailAnswered) {
          if (i === state.mailData.correctIndex) cls += " correct";
          else if (i === state.mailSelectedIdx) cls += " wrong";
        }
        return `<button class="${cls}" onclick="answerMailQuestion(${i})" ${state.mailAnswered ? "disabled" : ""}>${opt}</button>`;
      }).join("")}</div>
      ${state.mailAnswered ? `<button class="primary" onclick="finishMail()" style="margin-top:16px;">解説を見る</button>` : ""}
    `;
  } else if (state.phase === "mail_result") {
    c.innerHTML = `
      <div class="eyebrow">解説</div>
      <div class="translation">${state.mailData.explanation}</div>
      ${state.mailData.signalPhrases && state.mailData.signalPhrases.length ? `<div class="filler-list"><b style="color:var(--text);">判断のサインになったフレーズ</b><br/>${state.mailData.signalPhrases.map(f=>`<span class="fp">${f.phrase}</span>：${f.note}`).join("<br/>")}</div>` : ""}
      <div class="call-card"><div class="call-desc" style="color:var(--text);">${highlightFillers(state.mailData.body, state.mailData.signalPhrases)}</div></div>
      <button class="primary" onclick="goToHub()">ホームへ戻る</button>
    `;
  } else if (state.phase === "night_intro") {
    const doneToday = nightDoneToday();
    const inWin = nightInWindow();
    let logHtml = state.nightLog.slice(0,8).map(l => `<div class="log-item"><div><div>${l.character}</div><div class="log-date">${l.date}</div></div></div>`).join("");
    c.innerHTML = `
      <div class="eyebrow">💜 夜のひととき（21:00〜23:00）</div>
      <h1>誰かからメッセージが届いています</h1>
      <div class="desc">仕事のことは忘れて、気軽にチャットしましょう。採点はありません。</div>
      ${state.nightError ? `<div class="error-box">${state.nightError}</div>` : ""}
      ${!state.geminiApiKey ? `<label class="field-label">Gemini APIキー（無料・カード不要）</label><input type="password" id="geminiKeyInputNight" placeholder="AIza..." value="" />` : ""}
      ${state.nightLoading
        ? `<div class="spinner"></div><div class="desc" style="text-align:center;">メッセージを準備中…</div>`
        : doneToday
          ? `<div class="tip">今夜の分は完了しました。おやすみなさい。</div><button class="secondary" onclick="resetNightForTesting()">（動作確認用）リセットして再挑戦</button>`
          : !inWin
            ? `<div class="tip">今は21:00〜23:00の時間外です。</div><button class="secondary" onclick="startTonightChat()">（動作確認用）時間を無視して試す</button>`
            : `<button class="primary" onclick="startTonightChat()">メッセージを確認する</button>`}
      <button class="secondary" onclick="goToHub()">← ホームへ戻る</button>
      <button class="secondary" onclick="resetNightVoices()">🔁 声の割り当てをリセット（性別が合わない場合）</button>
      ${logHtml ? `<div class="desc" style="margin-top:20px;">履歴</div>${logHtml}` : ""}
    `;
  } else if (state.phase === "night_message") {
    c.innerHTML = `
      <div class="eyebrow">${state.nightCharacter.role}</div>
      <div class="night-card">
        <div class="night-name">${state.nightCharacter.name}</div>
        <div class="night-line">${state.nightData.message}</div>
      </div>
      <button class="secondary" onclick="playNightAudio()">🔊 聞く</button>${renderAudioControls()}
      <div class="translation">${state.nightData.ja}</div>
      <button class="primary" onclick="goToNightReply()" style="margin-top:10px;">返事を書く</button>
    `;
  } else if (state.phase === "night_reply") {
    c.innerHTML = `
      <div class="eyebrow">${state.nightCharacter.name}に返事する</div>
      <div class="desc">日本語で入力すると、自然な英語にします。</div>
      <textarea id="nightReplyJaInput" rows="3" placeholder="例：今日は忙しかったけど楽しかったよ！あなたは？">${state.nightReplyJa}</textarea>
      ${state.nightReplyError ? `<div class="error-box">${state.nightReplyError}</div>` : ""}
      ${state.nightReplyLoading ? `<div class="spinner"></div>` : `<button class="primary" onclick="translateNightReply()">英語にする</button>`}
      ${state.nightReplyEn ? `
        <div class="reply-en">${state.nightReplyEn}</div>
        ${state.nightReplyAudioUrl ? `<button class="secondary" onclick="playNightReplyAudio()">🔊 発音を聞く（任意）</button>` : ""}
      ` : ""}
      <button class="primary" onclick="finishNight()" style="margin-top:16px;">終了する</button>
    `;
  } else if (state.phase === "night_done") {
    c.innerHTML = `
      <div class="eyebrow">おやすみなさい</div>
      <div class="praise-box">${state.nightCharacter.name}との会話、お疲れさまでした。ゆっくり休んでください。</div>
      <button class="primary" onclick="goToHub()">ホームへ戻る</button>
    `;
  }
}

render();
</script>
</body>
</html>
