<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ラブのうっかり英語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 茶色のトイプードル「ラブ」(ドット絵)が毎回ひと言しゃべり、画面は白地に大きな文字と3択だけ。会話窓だけは濃紺で、昔のRPGのメッセージ窓の雰囲気にする。 */
:root {
  --bg: #ffffff;
  --paper: #ffffff;
  --ink: #1a2230;
  --ink-2: #566073;
  --line: #dde2ea;
  --pencil: #c92f2a;
  --pencil-soft: #fbeceb;
  --ok: #1d7a4f;
  --ok-soft: #e7f4ec;
  --win: #0a1030;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-type: "Courier Prime", "Courier New", monospace;
  --f-dot: "DotGothic16", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --paper: #171c24; --ink: #e8ecf2; --ink-2: #9aa5b6; --line: #2a323e;
    --pencil: #ff7a72; --pencil-soft: #3a1f1e; --ok: #5fd09a; --ok-soft: #17301f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --paper: #171c24; --ink: #e8ecf2; --ink-2: #9aa5b6; --line: #2a323e;
  --pencil: #ff7a72; --pencil-soft: #3a1f1e; --ok: #5fd09a; --ok-soft: #17301f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui);
  font-size: 20px; line-height: 1.7; margin: 0;
  padding-block: 20px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.type { font-family: var(--f-type); }
.small { font-size: 17px; color: var(--ink-2); }
.ico { flex: none; display: block; width: 30px; height: 30px; }

/* ラブとメッセージ窓 */
.love { image-rendering: pixelated; image-rendering: crisp-edges; width: 104px; height: 104px; flex: none; display: block; }
.love.bob { animation: bob 1s steps(1, end) infinite; }
@keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-4px); } 100% { transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .love.bob { animation: none; } }
.stage { display: flex; gap: 10px; align-items: flex-end; }
.win { flex: 1; min-width: 0; background: var(--win); color: #fff; border: 3px solid #fff; border-radius: 6px;
  box-shadow: 0 0 0 3px var(--win), 0 0 0 5px #8a93b8; padding: 10px 14px 12px; margin: 6px 6px 8px 0; position: relative; }
.win .who { font-family: var(--f-dot); font-size: 15px; color: #ffd966; letter-spacing: .1em; display: block; }
.win p { font-family: var(--f-dot); font-size: 22px; line-height: 1.55; }

/* home */
.title { font-size: 34px; font-weight: 700; letter-spacing: .02em; line-height: 1.25; text-wrap: balance; }
.sub { color: var(--ink-2); margin-top: 6px; font-size: 18px; }
.count-line { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 4px; }
.cta-row { display: grid; gap: 10px; margin-top: 16px; }
.btn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); padding: 18px; border-radius: 4px; font-weight: 700; font-size: 22px; text-align: left; display: flex; justify-content: space-between; gap: 12px; align-items: center; width: 100%; }
.btn.alt { background: transparent; color: var(--ink); }
.btn.red { background: var(--pencil); border-color: var(--pencil); color: #fff; }
.btn small { font-weight: 400; opacity: .9; font-size: 17px; }
.chap { margin: 26px 0 6px; font-size: 17px; color: var(--ink-2); letter-spacing: .08em; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
.row .jp { font-weight: 700; font-size: 26px; line-height: 1.4; }
.row .en { font-family: var(--f-type); font-size: 18px; color: var(--ink-2); display: block; overflow-wrap: anywhere; }
.row.lock { cursor: default; }
.row.lock .jp { color: var(--ink-2); font-weight: 500; }
.badge { font-size: 16px; border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; white-space: nowrap; color: var(--ink-2); }
.badge.done { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); font-weight: 700; }
.badge.go { border-color: var(--pencil); color: var(--pencil); }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.back { border: 1.5px solid var(--line); background: transparent; border-radius: 4px; padding: 8px 14px; font-size: 18px; white-space: nowrap; }
.segs { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.seg { height: 7px; border-radius: 2px; background: var(--line); }
.seg.now { background: var(--ink-2); }
.seg.ok { background: var(--ok); }
.seg.ng { background: var(--pencil); }
.count { font-family: var(--f-type); font-size: 20px; color: var(--ink-2); }

/* quiz */
.sentwrap { margin-top: 10px; border-left: 3px solid var(--pencil); padding: 6px 0 6px 14px; }
.sent { font-family: var(--f-type); font-size: 28px; line-height: 1.6; overflow-wrap: anywhere; }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--pencil); text-align: center; color: var(--pencil); font-weight: 700; }
.blank.filled { border-bottom-color: var(--ok); color: var(--ok); }
.hint { margin-top: 14px; font-size: 18px; color: var(--ink-2); }
.opts { display: grid; gap: 12px; margin-top: 10px; }
.opt { position: relative; overflow: hidden; width: 100%; display: grid; grid-template-columns: 1.4em minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 16px 14px 18px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--paper); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.opt .l { font-family: var(--f-type); font-weight: 700; font-size: 26px; color: var(--ink-2); }
.opt .t { font-family: var(--f-type); font-size: 30px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.opt .m { font-weight: 700; font-size: 17px; white-space: nowrap; }
.opt .ico { color: var(--ink-2); }
.opt::after { content: ""; position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: var(--pencil); }
.opt.holding::after { width: 100%; transition: width .6s linear; }
.opt.holding { border-color: var(--pencil); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .m { color: var(--ok); }
.opt.wrong { border-color: var(--pencil); background: var(--pencil-soft); }
.opt.wrong .m { color: var(--pencil); }
.fb { margin-top: 18px; padding: 14px 16px; border-radius: 4px; background: var(--paper); border: 1.5px solid var(--line); }
.fb .verdict { font-weight: 700; font-size: 26px; }
.fb .verdict.ok { color: var(--ok); }
.fb .verdict.ng { color: var(--pencil); }
.fb .tr { margin-top: 4px; font-size: 20px; }
.fb .tag { display: block; margin-top: 12px; font-size: 16px; color: var(--ink-2); letter-spacing: .08em; }
.ims { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.ims li { font-size: 19px; line-height: 1.5; padding: 6px 10px; border-radius: 3px; border: 1px solid var(--line); }
.ims li.ok { border-color: var(--ok); background: var(--ok-soft); font-weight: 700; }
.say { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; padding: 8px 0 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.say .ico { color: var(--pencil); }
.say .st { font-family: var(--f-type); font-size: 22px; line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
.next { margin-top: 16px; }

/* result */
.score { font-family: var(--f-type); font-weight: 700; font-size: 68px; line-height: 1.1; }
.stamp { display: inline-block; border: 3.5px solid var(--pencil); color: var(--pencil); padding: 2px 16px; font-weight: 700; letter-spacing: .25em; transform: rotate(-5deg); border-radius: 4px; font-size: 30px; margin: 14px 0 6px; }
.stamp.soft { border-color: var(--ink-2); color: var(--ink-2); font-size: 22px; }
.miss { margin-top: 16px; display: grid; gap: 16px; }
.miss .item { border-left: 3px solid var(--pencil); padding-left: 14px; }
.miss .ja { font-size: 18px; color: var(--ink-2); }
.empty { margin-top: 24px; color: var(--ink-2); }

a.btn { text-decoration: none; }
.hearts { font-family: var(--f-type); font-size: 22px; color: var(--pencil); letter-spacing: .05em; white-space: nowrap; }
.mic { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 20px; border-radius: 4px; border: 0; background: var(--pencil); color: #fff; font-weight: 700; font-size: 24px; margin-top: 12px; }
.mic.rec { background: var(--ink); }
.big { font-family: var(--f-type); font-size: 28px; line-height: 1.6; overflow-wrap: anywhere; }
.big.q { color: var(--ink-2); letter-spacing: .2em; }
.heard { margin-top: 10px; font-family: var(--f-type); font-size: 22px; color: var(--ink-2); overflow-wrap: anywhere; }
.note { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--bg); font-size: 19px; text-align: center;
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (prefers-reduced-motion: no-preference) {
  .opt, .btn, .back { transition: background-color .15s, border-color .15s; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="note" id="note" role="status" hidden></div>

        '<button class="btn next" data-act="next"><span>' + (last ? "結果を見る" : "次の問題へ") + '</span><span class="type">&rarr;</span></button>';
    }
    var hint = answered ? "" : '<p class="hint">タップ: 英文を音で聞く / 長押し: これを答えにする</p>';
    return barView() +
      '<div class="stage">' + love(state, false) + '<div class="win"><span class="who">ラブ</span><p>' + esc(it.ja) + "</p></div></div>" +
      '<div class="sentwrap"><div class="sent">' + sentHtml(it, answered ? it.ok : "") + "</div></div>" +
      hint + '<div class="opts">' + opts + "</div>" + fb;
  }

  function resultView() {
    var s = S.sess, total = s.items.length;
    var done = s.items.filter(function (it) { return it.picked !== null; });
    var okc = done.filter(function (it) { return it.opts[it.picked].ok; }).length;
    var wrong = done.filter(function (it) { return !it.opts[it.picked].ok; });
    total = done.length;
    var head, stamp = "";
    if (s.kind === "battle") {
      var win = s.hearts > 0 && s.items.every(function (it) { return it.picked !== null; });
      stamp = win ? '<div class="stamp">勝利</div>' : '<div class="stamp soft">ざんねん</div>';
      head = "どうしバトル  ハート " + s.hearts + "/3";
    } else if (s.kind === "stage") {
      var st = stat(s.gid), g = grp(s.gid);
      stamp = st.mastered ? '<div class="stamp">習得</div>' : '<div class="stamp soft">もう一歩</div>';
      head = g.ja + "  " + g.en;
    } else { head = "ふくしゅう"; }
    var m = wrong.map(function (it) {
      return '<div class="item"><p class="ja">' + esc(it.ja) + "</p>" +
        '<button class="say" data-act="say" data-say="' + esc(fill(it.s, it.ok)) + '">' + ICON + '<span class="st">' + esc(fill(it.s, it.ok)) + "</span></button>" +
        '<p class="small" style="margin-top:2px">' + esc(it.tr) + "</p></div>";
    }).join("");
    var btns = "";
    if (s.kind === "battle") {
      btns += '<button class="btn alt" data-act="battle"><span>もう一度バトル</span><span class="type">&crarr;</span></button>';
    } else if (s.kind === "stage") {
      btns += '<button class="btn red" data-act="talkg" data-g="' + s.gid + '"><span>この5文を声で言ってみる<br><small>日本語を見て、英文ぜんぶ</small></span><span class="type">&rarr;</span></button>';
      btns += '<button class="btn alt" data-act="start" data-g="' + s.gid + '"><span>もう一度</span><span class="type">&crarr;</span></button>';
    } else if (missed().length) {
      btns += '<button class="btn alt" data-act="review"><span>残りをふくしゅう<br><small>' + missed().length + "問</small></span><span class=\"type\">&rarr;</span></button>";
    }
    btns += '<button class="btn alt" data-act="home"><span>ホームへ</span><span class="type">&rarr;</span></button>';
    return '<div class="stage">' + love(okc === total && total > 0 ? "happy" : "idle", false) +
      '<div class="win"><span class="who">ラブ</span><p>' + (okc === total && total > 0 ? "ぜんぶ正解だワン!" : "ここをもう一回、聞いてみるワン。") + "</p></div></div>" +
      '<p class="small" style="margin-top:10px">' + esc(head) + "</p>" +
      '<div class="score">' + okc + '<span class="small"> / ' + total + "</span></div>" + stamp +
      (wrong.length ? '<h3 class="chap">まちがえた文(タップで聞けます)</h3><div class="miss">' + m + "</div>" : "") +
      '<div class="cta-row" style="margin-top:26px">' + btns + "</div>";
  }

  function emptyView() {
    return '<div class="bar"><button class="back" data-act="home">&larr; 戻る</button></div><h2 class="title" style="font-size:26px">ふくしゅう</h2><p class="empty">間違えた問題はありません。</p>';
  }

  /* ---------- 声で言うチャレンジ ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function words(t) { return String(t).toLowerCase().replace(/[’]/g, "'").replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(Boolean); }
  function lcs(a, b) {
    var m = a.length, n = b.length, d = [], i, j;
    for (i = 0; i <= m; i++) { d.push([]); for (j = 0; j <= n; j++) d[i].push(0); }
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
    return d[m][n];
  }
  function score(target, heard) { var a = words(target), b = words(heard); return a.length ? lcs(a, b) / a.length : 0; }
  function sayItems(list) {
    return list.map(function (x) { var g = grp(x.g), q = g.qs[x.i]; return { id: qid(x.g, x.i), ja: q.tr, en: fill(q.s, q.o[0][0]), res: null, heard: "", rec: false }; });
  }
  function startTalk(list) {
    S.talk = { i: 0, items: sayItems(list), self: false };
    go("talk");
  }
  function allRefs() { var o = []; allq().forEach(function (g) { g.qs.forEach(function (_, i) { o.push({ g: g.id, i: i }); }); }); return o; }
  function talkView() {
    var t = S.talk, it = t.items[t.i], res = it.res;
    var state = res === null ? "idle" : (res ? "happy" : "sad");
    var segs = t.items.map(function (x, i) { var c = "seg"; if (x.res !== null) c += x.res ? " ok" : " ng"; else if (i === t.i) c += " now"; return '<span class="' + c + '"></span>'; }).join("");
    var h = '<div class="bar"><button class="back" data-act="home">&times; やめる</button><div class="segs" aria-hidden="true">' + segs + '</div><span class="count">' + (t.i + 1) + "/" + t.items.length + "</span></div>" +
      '<div class="stage">' + love(state, false) + '<div class="win"><span class="who">ラブ</span><p>' + esc(it.ja) + "</p></div></div>";
    if (res === null) {
      h += '<div class="sentwrap"><div class="big q">' + (t.shown ? esc(it.en) : "? ? ?") + "</div></div>";
      h += '<p class="hint">この日本語を、英語の1文で言ってみよう。</p>';
      if (SR) {
        h += '<button class="mic' + (it.rec ? " rec" : "") + '" data-act="mic">' + ICON + (it.rec ? "聞いています…" : "タップして、言う") + "</button>";
        if (it.heard) h += '<p class="heard">聞こえた英語: ' + esc(it.heard) + "</p>";
      } else {
        h += '<button class="mic" data-act="reveal">' + "答えを見る" + "</button>";
      }
      h += '<div class="cta-row"><button class="btn alt" data-act="hint"><span>ヒント(英文を見る)</span></button>' +
        '<button class="btn alt" data-act="skip"><span>わからない</span></button></div>';
    } else {
      h += '<div class="fb"><div class="verdict ' + (res ? "ok" : "ng") + '">' + (res ? "言えた!" : "惜しい!") + "</div>" +
        '<button class="say" data-act="say" data-say="' + esc(it.en) + '">' + ICON + '<span class="st">' + esc(it.en) + "</span></button>" +
        (it.heard ? '<p class="heard">聞こえた英語: ' + esc(it.heard) + "</p>" : "") + "</div>";
      var last = t.i === t.items.length - 1;
      h += '<button class="btn next" data-act="tnext"><span>' + (last ? "ホームへ" : "次の文へ") + '</span><span class="type">&rarr;</span></button>';
    }
    if (res === null && it.self) {
      h += '<div class="cta-row"><button class="btn" data-act="selfok"><span>言えた</span></button><button class="btn alt" data-act="selfng"><span>言えなかった</span></button></div>';
    }
    return h;
  }
  function listen() {
    var t = S.talk, it = t.items[t.i];
    if (!SR || it.rec) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    var r = new SR(), got = false, idx = t.i;
    r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 3; r.continuous = false;
    function fin(heardList, err) {
      if (got) return; got = true;
      var tt = S.talk; if (!tt || tt.i !== idx || S.view !== "talk") return;
      var x = tt.items[idx]; x.rec = false;
      if (err || !heardList || !heardList.length) {
        note(err === "not-allowed" || err === "service-not-allowed" ? "マイクが許可されていません(ブラウザの設定で許可してください)" : "聞き取れませんでした。もう一度どうぞ");
        x.heard = ""; render(); return;
      }
      var best = 0, bh = heardList[0];
      heardList.forEach(function (h) { var sc = score(x.en, h); if (sc > best) { best = sc; bh = h; } });
      x.heard = bh; x.res = best >= 0.85;
      P["say:" + x.id] = x.res; save();
      render();
    }
    r.onresult = function (e) { var a = []; for (var k = 0; k < e.results[0].length; k++) a.push(e.results[0][k].transcript); fin(a, null); };
    r.onerror = function (e) { fin(null, e && e.error ? e.error : "error"); };
    r.onend = function () { fin(null, "no-speech"); };
    try { it.rec = true; render(); r.start(); } catch (e) { it.rec = false; render(); note("この画面では、声の聞き取りが使えません"); }
  }
  function render() {
    var html;
    if (S.view === "home") html = homeView();
    else if (S.view === "quiz") html = quizView();
    else if (S.view === "result") html = resultView();
    else if (S.view === "talk") html = talkView();
    else html = emptyView();
    app.innerHTML = html;
  }

  /* ---------- 操作 ---------- */
  function startGroup(gid) {
    var g = grp(gid); if (!g || g.wait) return;
    S.sess = { kind: "stage", gid: gid, i: 0, items: shuffle(g.qs.map(function (_, i) { return i; })).map(function (i) { return mk(gid, i); }) };
    go("quiz", gid);
  }
  function startBattle() {
    var g = grp("bt");
    var idx = shuffle(g.qs.map(function (_, i) { return i; })).slice(0, 10);
    S.sess = { kind: "battle", gid: "bt", i: 0, hearts: 3, items: idx.map(function (i) { return mk("bt", i); }) };
    go("quiz", "bt");
  }
  function startReview() {
    var list = shuffle(missed()).slice(0, 5);
    if (!list.length) { go("empty"); return; }
    S.sess = { kind: "review", gid: "", i: 0, items: list.map(function (x) { return mk(x.g, x.i); }) };
    go("quiz");
  }
  function pick(k) {
    var it = cur();
    if (!it || it.picked !== null) return;
    it.picked = k;
    P[it.id] = it.opts[k].ok;
    if (!it.opts[k].ok && S.sess.kind === "battle") S.sess.hearts--;
    save();
    render();
    try { var fb = document.getElementById("fb"); if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (err) {}
  }

  /* 選択肢: タップ=その英文を音で聞く / 長押し=答えにする */
  var HOLD_MS = 600, holdTimer = null, holdEl = null, holdFired = false;
  function endHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdEl) { try { holdEl.classList.remove("holding"); } catch (e) {} holdEl = null; }
  }
  app.addEventListener("pointerdown", function (e) {
    var el = e.target.closest("[data-k]");
    if (!el) return;
    var it = cur(); if (!it) return;
    endHold(); holdFired = false; holdEl = el;
    if (it.picked === null) {
      try { void el.offsetWidth; el.classList.add("holding"); } catch (err) {}
      holdTimer = setTimeout(function () { holdFired = true; var k = +el.dataset.k; endHold(); pick(k); }, HOLD_MS);
    }
  });
  app.addEventListener("pointerup", function (e) {
    var el = e.target.closest("[data-k]");
    var fired = holdFired, had = holdEl;
    endHold();
    if (!el || fired || !had) { holdFired = false; return; }
    var it = cur(); if (!it) return;
    say(fill(it.s, it.opts[+el.dataset.k].t));
  });
  app.addEventListener("pointercancel", function () { endHold(); });
  app.addEventListener("contextmenu", function (e) { if (e.target.closest("[data-k], .say")) e.preventDefault(); });

  app.addEventListener("click", function (e) {
    var o = e.target.closest("[data-k]");
    if (o) { if (e.detail === 0) { var it0 = cur(); if (it0) say(fill(it0.s, it0.opts[+o.dataset.k].t)); } return; }
    var el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    var act = el.dataset.act;
    if (act === "home") { try { window.speechSynthesis.cancel(); } catch (err) {} go("home"); }
    else if (act === "start") startGroup(el.dataset.g);
    else if (act === "review") startReview();
    else if (act === "say") say(el.dataset.say);
    else if (act === "battle") startBattle();
    else if (act === "talk") startTalk(shuffle(allRefs()).slice(0, 5));
    else if (act === "talkg") { var gg = grp(el.dataset.g); startTalk(gg.qs.map(function (_, i) { return { g: gg.id, i: i }; })); }
    else if (act === "mic") listen();
    else if (act === "hint") { S.talk.shown = true; render(); }
    else if (act === "reveal") { S.talk.shown = true; S.talk.items[S.talk.i].self = true; render(); }
    else if (act === "selfok" || act === "selfng") { var ti = S.talk.items[S.talk.i]; ti.res = act === "selfok"; P["say:" + ti.id] = ti.res; save(); render(); }
    else if (act === "skip") { var t2 = S.talk.items[S.talk.i]; t2.res = false; t2.heard = ""; S.talk.shown = true; render(); }
    else if (act === "tnext") { var t3 = S.talk; if (t3.i < t3.items.length - 1) { t3.i++; t3.shown = false; go("talk"); } else go("home"); }
    else if (act === "next") {
      var s = S.sess;
      if (s.i < s.items.length - 1 && !(s.kind === "battle" && s.hearts <= 0)) { s.i++; go("quiz"); } else { go("result"); }
    }
  });

  render();
})();
</script>
</body>
</html>
