<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>悪文なおし道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 原稿用紙に赤鉛筆を入れる感覚。白い紙面、大きなタイプライター書体の英文、余白の赤い校正線。大胆さは「習得」スタンプ一点に集中させる。 */
:root {
  --bg: #ffffff;
  --paper: #ffffff;
  --ink: #1a2230;
  --ink-2: #566073;
  --line: #dde2ea;
  --pencil: #c92f2a;
  --pencil-soft: #fbeceb;
  --ok: #1d7a4f;
  --ok-soft: #e7f4ec;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-type: "Courier Prime", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --paper: #171c24; --ink: #e8ecf2; --ink-2: #9aa5b6; --line: #2a323e;
    --pencil: #ff7a72; --pencil-soft: #3a1f1e; --ok: #5fd09a; --ok-soft: #17301f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --paper: #171c24; --ink: #e8ecf2; --ink-2: #9aa5b6; --line: #2a323e;
  --pencil: #ff7a72; --pencil-soft: #3a1f1e; --ok: #5fd09a; --ok-soft: #17301f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui);
  font-size: 20px; line-height: 1.7; margin: 0;
  padding-block: 20px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.type { font-family: var(--f-type); }
.small { font-size: 17px; color: var(--ink-2); }
.ico { flex: none; display: block; }

/* home */
.title { font-size: 38px; font-weight: 700; letter-spacing: .02em; line-height: 1.25; text-wrap: balance; }
.sub { color: var(--ink-2); margin-top: 6px; font-size: 18px; }
.strip-head { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 8px; }
.strip { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.cell { aspect-ratio: 1; min-width: 0; display: grid; place-items: center; border: 1.5px dashed var(--line); border-radius: 3px; font-family: var(--f-type); font-size: 22px; color: var(--ink-2); background: transparent; padding: 0; }
.cell.play { border: 1.5px solid var(--pencil); color: var(--pencil); font-weight: 700; }
.cell.done { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
.cta-row { display: grid; gap: 10px; margin-top: 20px; }
.btn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); padding: 18px 18px; border-radius: 4px; font-weight: 700; font-size: 22px; text-align: left; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.btn.alt { background: transparent; color: var(--ink); }
.btn.red { background: var(--pencil); border-color: var(--pencil); color: var(--bg); }
.btn small { font-weight: 400; opacity: .9; font-size: 17px; }
.chap { margin: 28px 0 6px; font-size: 17px; color: var(--ink-2); letter-spacing: .08em; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.row { width: 100%; display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
.row .no { font-family: var(--f-type); font-weight: 700; color: var(--pencil); font-size: 26px; line-height: 1.4; }
.row .jp { font-weight: 500; font-size: 22px; line-height: 1.5; }
.row .en { font-family: var(--f-type); font-size: 17px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; overflow-wrap: anywhere; display: inline-block; }
.row.lock { cursor: default; }
.row.lock .no, .row.lock .jp { color: var(--ink-2); }
.badge { font-size: 16px; border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; white-space: nowrap; color: var(--ink-2); margin-top: 4px; }
.badge.done { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); font-weight: 700; }
.badge.go { border-color: var(--pencil); color: var(--pencil); }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.back { border: 1.5px solid var(--line); background: transparent; border-radius: 4px; padding: 8px 14px; font-size: 18px; white-space: nowrap; }
.segs { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.seg { height: 7px; border-radius: 2px; background: var(--line); }
.seg.now { background: var(--ink-2); }
.seg.ok { background: var(--ok); }
.seg.ng { background: var(--pencil); }
.count { font-family: var(--f-type); font-size: 20px; color: var(--ink-2); }

/* rule */
.rulehead { font-family: var(--f-type); color: var(--pencil); font-weight: 700; font-size: 20px; letter-spacing: .12em; }
.ruleen { font-family: var(--f-type); font-size: 27px; line-height: 1.45; margin-top: 8px; font-weight: 700; overflow-wrap: anywhere; }
.rulejp { margin-top: 14px; font-size: 23px; font-weight: 500; text-wrap: pretty; }
.manu { border-left: 3px solid var(--pencil); background: var(--paper); padding: 8px 0 8px 14px; margin-top: 18px; display: grid; gap: 12px; }
.tag { font-size: 16px; color: var(--ink-2); letter-spacing: .08em; display: block; }
.say { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: transparent; border: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.say .sent { font-family: var(--f-type); font-size: 26px; line-height: 1.55; overflow-wrap: anywhere; min-width: 0; flex: 1; }
.say .ico { color: var(--pencil); margin-top: 8px; width: 30px; height: 30px; }
.notes { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; font-size: 19px; color: var(--ink-2); }
.notes li { padding-left: 1.2em; position: relative; }
.notes li::before { content: "※"; position: absolute; left: 0; color: var(--pencil); }

/* quiz */
.q { font-size: 26px; font-weight: 500; line-height: 1.55; text-wrap: pretty; }
.bad { margin-top: 14px; border-left: 3px solid var(--pencil); padding: 8px 0 8px 14px; }
.bad .say .sent { font-size: 28px; }
.ul { text-decoration: underline wavy var(--pencil); text-underline-offset: 6px; }
.hint { margin-top: 18px; font-size: 19px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.hint .ico { color: var(--pencil); }
.opts { display: grid; gap: 12px; margin-top: 12px; }
.opt { position: relative; overflow: hidden; width: 100%; display: grid; grid-template-columns: 1.5em minmax(0, 1fr) auto; gap: 10px; align-items: start; text-align: left; padding: 18px 14px 20px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--paper); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.opt .l { font-family: var(--f-type); font-weight: 700; font-size: 26px; color: var(--ink-2); line-height: 1.5; }
.opt .t { font-family: var(--f-type); font-size: 26px; line-height: 1.5; overflow-wrap: anywhere; }
.opt .m { font-weight: 700; font-size: 17px; white-space: nowrap; padding-top: 4px; }
.opt .ico { color: var(--ink-2); margin-top: 4px; width: 30px; height: 30px; }
.opt::after { content: ""; position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: var(--pencil); }
.opt.holding::after { width: 100%; transition: width .6s linear; }
.opt.holding { border-color: var(--pencil); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .m { color: var(--ok); }
.opt.wrong { border-color: var(--pencil); background: var(--pencil-soft); }
.opt.wrong .m { color: var(--pencil); }
.fb { margin-top: 18px; padding: 14px 16px; border-radius: 4px; background: var(--paper); border: 1.5px solid var(--line); }
.fb .verdict { font-weight: 700; font-size: 26px; }
.fb .verdict.ok { color: var(--ok); }
.fb .verdict.ng { color: var(--pencil); }
.fb .rtag { font-family: var(--f-type); font-weight: 700; color: var(--pencil); font-size: 17px; letter-spacing: .1em; margin-top: 8px; }
.fb p.why { margin-top: 4px; font-size: 21px; text-wrap: pretty; }
.next { margin-top: 16px; }

/* result */
.score { font-family: var(--f-type); font-weight: 700; font-size: 68px; line-height: 1.1; }
.stamp { display: inline-block; border: 3.5px solid var(--pencil); color: var(--pencil); padding: 2px 16px; font-weight: 700; letter-spacing: .25em; transform: rotate(-5deg); border-radius: 4px; font-size: 30px; margin: 14px 0 6px; }
.stamp.soft { border-color: var(--ink-2); color: var(--ink-2); font-size: 22px; }
.miss { margin-top: 20px; display: grid; gap: 16px; }
.miss .item { border-left: 3px solid var(--pencil); padding-left: 14px; }
.miss .was { font-family: var(--f-type); font-size: 22px; text-decoration: line-through var(--pencil); overflow-wrap: anywhere; }
.miss .fix { font-family: var(--f-type); font-size: 24px; color: var(--ok); font-weight: 700; margin-top: 4px; overflow-wrap: anywhere; }
.empty { margin-top: 24px; color: var(--ink-2); }

.note { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--bg); font-size: 19px; text-align: center;
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (prefers-reduced-motion: no-preference) {
  .opt, .btn, .back { transition: background-color .15s, border-color .15s; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="note" id="note" role="status" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------- 18のルール(本の見出しに沿う) ---------- */
  var RULES = [
    { n: 1, ch: 0, jp: "「〜の」は 's を付けて表す", en: "Form the possessive singular of nouns by adding 's." },
    { n: 2, ch: 0, jp: "3つ以上を並べるとき、最後の and の前にもコンマ", en: "In a series of three or more terms with a single conjunction, use a comma after each term except the last." },
    { n: 3, ch: 0, jp: "文の途中の補足は、前後をコンマで挟む", en: "Enclose parenthetic expressions between commas." },
    { n: 4, ch: 0, jp: "and や but で2つの文をつなぐとき、その前にコンマ", en: "Place a comma before a conjunction introducing a co-ordinate clause." },
    { n: 5, ch: 0, jp: "2つの文を、コンマだけでつなぐな", en: "Do not join independent clauses by a comma." },
    { n: 6, ch: 0, jp: "1つの文を、ピリオドで途中で切るな", en: "Do not break sentences in two." },
    { n: 7, ch: 0, jp: "文の最初の「〜しながら」は、主語の動作にする", en: "A participial phrase at the beginning of a sentence must refer to the grammatical subject." },
    { n: 8, ch: 1, jp: "段落は、話題1つにつき1つ", en: "Make the paragraph the unit of composition: one paragraph to each topic." },
    { n: 9, ch: 1, jp: "段落は、いちばん言いたい文で始める", en: "As a rule, begin each paragraph with a topic sentence; end it in conformity with the beginning." },
    { n: 10, ch: 1, jp: "「〜される」より「〜する」で書く", en: "Use the active voice." },
    { n: 11, ch: 1, jp: "「〜ない」より、言い切る形で書く", en: "Put statements in positive form." },
    { n: 12, ch: 1, jp: "ぼんやりより、具体的に書く", en: "Use definite, specific, concrete language." },
    { n: 13, ch: 1, jp: "いらない言葉は削る", en: "Omit needless words." },
    { n: 14, ch: 1, jp: "and や but で、文を延々とつなげない", en: "Avoid a succession of loose sentences." },
    { n: 15, ch: 1, jp: "並べる内容は、同じ形でそろえる", en: "Express co-ordinate ideas in similar form." },
    { n: 16, ch: 1, jp: "つながる言葉は、近くに置く", en: "Keep related words together." },
    { n: 17, ch: 1, jp: "あらすじは、現在形か過去形のどちらかにそろえる", en: "In summaries, keep to one tense." },
    { n: 18, ch: 1, jp: "いちばん言いたい言葉は、文の最後に置く", en: "Place the emphatic words of a sentence at the end." }
  ];
  var CHAPTERS = ["第2章 用法の基本ルール(1〜7)", "第3章 文章構成の原則(8〜18)"];

  /* ---------- 遊べるステージ(ルール1〜3) ---------- */
  var PLAY = {
    1: {
      gloss: "「〜の」(持ち主を表す形)を作るときは、名前や名詞の後ろに 's を付けます。Charles のように s で終わる名前でも、Charles's と 's を付けます。",
      examples: ["Charles's friend", "Burns's poems", "the witch's malice"],
      notes: [
        "例外: Achilles や Isis のように -es / -is で終わる古代の名前、Jesus、for conscience' sake は、' だけを付けます。ただし本は、Achilles' heel のような形は the heel of Achilles(アキレスのかかと)と言い換えるのが一般的だとしています。",
        "hers, its, theirs, yours, oneself のように、もともと「〜のもの」を表す言葉には、' を付けません。it's は it is の短縮形で、別の意味です。"
      ],
      qs: [
        { q: "次の悪文を直してください。", bad: "Burns' poems are still read today.",
          ok: "Burns's poems are still read today.",
          ng: ["Burns poems are still read today.", "Burns's poem's are still read today."],
          why: "「〜の」は 's を付けます。Burns のように s で終わる名前でも、Burns's poems(バーンズの詩)です。読むと「バーンズィズ」と音が1つ増えます。" },
        { q: "次の悪文を直してください。", bad: "The dog wagged it's tail.",
          ok: "The dog wagged its tail.",
          ng: ["The dog wagged its' tail.", "The dog wagged it tail."],
          why: "its(それの)には ' を付けません。it's は it is の短縮形です。its と it's は同じ発音なので、耳では区別できません。" },
        { q: "「チャールズの友だち」。本のルールでは、どれが正しい形?", bad: "",
          ok: "Charles's friend",
          ng: ["Charles' friend", "Charles friend's"],
          why: "Charles は s で終わりますが、「〜の」は 's を付けます。" },
        { q: "「アキレスのかかと」。s で終わる古代の名前です。本が一般的だとする書き方はどれ?", bad: "",
          ok: "the heel of Achilles",
          ng: ["Achilles's heel", "Achilles heel'"],
          why: "Achilles のような古代の名前は例外です。' だけを付ける形もありますが、本は the heel of Achilles と言い換えるのが一般的だとしています。" },
        { q: "次の悪文を直してください。", bad: "The book is her's, not mine.",
          ok: "The book is hers, not mine.",
          ng: ["The book is hers', not mine.", "The book is her, not mine."],
          why: "hers は「彼女のもの」。hers, its, theirs, yours, oneself には ' を付けません。" }
      ]
    },
    2: {
      gloss: "3つ以上を並べて、最後を and か or でつなぐときは、その and / or の前にもコンマを付けます。",
      examples: ["red, white, and blue", "gold, silver, or copper", "He opened the letter, read it, and made a note of its contents."],
      notes: ["会社名だけは例外で、最後のコンマを付けません: Brown, Shipley & Co."],
      qs: [
        { q: "次の悪文を直してください。", bad: "The flag was red, white and blue.",
          ok: "The flag was red, white, and blue.",
          ng: ["The flag was red white, and blue.", "The flag was red, white and, blue."],
          why: "red, white, and blue のように、and の前にもコンマを付けます。" },
        { q: "次の悪文を直してください。", bad: "Choose gold, silver or copper.",
          ok: "Choose gold, silver, or copper.",
          ng: ["Choose gold silver, or copper.", "Choose, gold, silver or copper."],
          why: "gold, silver, or copper。or の前にもコンマです。" },
        { q: "次の悪文を直してください。", bad: "He opened the letter, read it and made a note of its contents.",
          ok: "He opened the letter, read it, and made a note of its contents.",
          ng: ["He opened the letter read it, and made a note of its contents.", "He opened, the letter, read it and made a note of its contents."],
          why: "動作を3つ並べています。read it の後ろ、and の前にもコンマを付けます。" },
        { q: "会社名の書き方。本のルールに沿って選んでください。", bad: "",
          ok: "Brown, Shipley & Co.",
          ng: ["Brown, Shipley, & Co.", "Brown Shipley, & Co."],
          why: "会社名だけは例外で、最後のコンマを付けません。" },
        { q: "次の悪文を直してください。", bad: "We packed tents, stoves and lanterns.",
          ok: "We packed tents, stoves, and lanterns.",
          ng: ["We packed tents stoves, and lanterns.", "We packed, tents, stoves and lanterns."],
          why: "tents, stoves, and lanterns。3つ並べるときは、and の前にもコンマです。" }
      ]
    },
    3: {
      gloss: "文の途中に補足の言葉を入れるときは、その前後をコンマで挟みます。片方だけにコンマを付けるのは、まちがいです。",
      examples: [
        "The best way to see a country, unless you are pressed for time, is to travel on foot.",
        "The audience, which had at first been indifferent, became more and more interested.",
        "The candidate who best meets these requirements will obtain the place."
      ],
      notes: [
        "いつも補足として挟むもの: 日付の年(April 6, 1917)、曜日の後の日付、etc. と jr.、そして who や which で始まる補足の説明(2つ目の例)。",
        "ただし、「どの人か」を決めるための who の説明は、挟みません(3つ目の例)。その説明がないと、誰のことか決まらないからです。"
      ],
      qs: [
        { q: "次の悪文を直してください。", bad: "Marjorie's husband, Colonel Nelson paid us a visit yesterday.",
          ok: "Marjorie's husband, Colonel Nelson, paid us a visit yesterday.",
          ng: ["Marjorie's husband Colonel Nelson, paid us a visit yesterday.", "Marjorie's husband, Colonel Nelson paid us a visit, yesterday."],
          why: "Colonel Nelson は補足なので、前後をコンマで挟みます。片方だけはまちがいです。" },
        { q: "次の悪文を直してください。", bad: "My brother you will be pleased to hear, is now in perfect health.",
          ok: "My brother, you will be pleased to hear, is now in perfect health.",
          ng: ["My brother, you will be pleased to hear is now in perfect health.", "My brother you, will be pleased to hear, is now in perfect health."],
          why: "you will be pleased to hear が補足です。前後にコンマを置きます。" },
        { q: "「どの候補者か」を決める説明です。正しい形はどれ?", bad: "",
          ok: "The candidate who best meets these requirements will obtain the place.",
          ng: ["The candidate, who best meets these requirements, will obtain the place.", "The candidate who best meets these requirements, will obtain the place."],
          why: "who 以下は「どの候補者か」を決める説明なので、コンマで挟みません。" },
        { q: "次の悪文を直してください。", bad: "He was born on April 6 1917 in Ohio.",
          ok: "He was born on April 6, 1917, in Ohio.",
          ng: ["He was born on April 6, 1917 in Ohio.", "He was born on April, 6 1917, in Ohio."],
          why: "日付の年も補足として扱います。文の途中では、年の後ろにもコンマを付けます。" },
        { q: "次の悪文を直してください。", bad: "The audience which had at first been indifferent became more and more interested.",
          ok: "The audience, which had at first been indifferent, became more and more interested.",
          ng: ["The audience which had at first been indifferent, became more and more interested.", "The audience, which had at first been indifferent became more and more interested."],
          why: "どの聴衆かはもう分かっていて、which 以下は補足の説明です。だからコンマで挟みます。" }
      ]
    }
  };

  /* ---------- 状態と保存(この端末のブラウザ内のみ) ---------- */
  var KEY = "akubun-dojo-v1";
  var P = {};
  try { P = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { P = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
  var S = { view: "home", n: 0, sess: null };
  var app = document.getElementById("app");
  var noteEl = document.getElementById("note"), noteTimer = null;

  var ICON = '<svg class="ico" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function qid(n, i) { return "r" + n + "-" + i; }
  function stat(n) {
    var d = PLAY[n]; if (!d) return null;
    var t = d.qs.length, c = 0, a = 0;
    d.qs.forEach(function (_, i) { var v = P[qid(n, i)]; if (v === true) { c++; a++; } else if (v === false) { a++; } });
    return { total: t, correct: c, answered: a, mastered: a === t && c / t >= 0.9 };
  }
  function masteredCount() { var k = 0; RULES.forEach(function (r) { var s = stat(r.n); if (s && s.mastered) k++; }); return k; }
  function missed() {
    var out = [];
    Object.keys(PLAY).forEach(function (n) { PLAY[n].qs.forEach(function (_, i) { if (P[qid(n, i)] === false) out.push({ n: +n, i: i }); }); });
    return out;
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function mk(n, i) {
    var x = PLAY[n].qs[i];
    var opts = shuffle([{ t: x.ok, ok: true }].concat(x.ng.map(function (t) { return { t: t, ok: false }; })));
    return { id: qid(n, i), n: n, q: x.q, bad: x.bad, why: x.why, ok: x.ok, opts: opts, picked: null };
  }
  function go(view, n) { S.view = view; if (n !== undefined) S.n = n; render(); try { window.scrollTo(0, 0); } catch (e) {} }
  function cur() { return S.view === "quiz" && S.sess ? S.sess.items[S.sess.i] : null; }

  /* ---------- 音声(端末の読み上げ機能を使う) ---------- */
  function note(msg) {
    noteEl.textContent = msg; noteEl.hidden = false;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { noteEl.hidden = true; }, 3500);
  }
  function pickVoice() {
    try {
      var vs = window.speechSynthesis.getVoices() || [];
      return vs.filter(function (v) { return /^en[-_]US/i.test(v.lang); })[0] || vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
    } catch (e) { return null; }
  }
  function say(text) {
    try {
      var ss = window.speechSynthesis;
      if (!ss || !window.SpeechSynthesisUtterance) { note("この画面では音声が使えないようです"); return; }
      ss.cancel();
      var u = new window.SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.85;
      var v = pickVoice(); if (v) u.voice = v;
      u.onerror = function (ev) { if (ev && ev.error && ev.error !== "canceled" && ev.error !== "interrupted") note("音を出せませんでした(" + ev.error + ")"); };
      ss.speak(u);
    } catch (e) { note("音を出せませんでした"); }
  }

  /* ---------- 画面 ---------- */
  function homeView() {
    var done = masteredCount();
    var strip = RULES.map(function (r) {
      var s = stat(r.n);
      var cls = s ? (s.mastered ? "cell done" : "cell play") : "cell";
      var attr = s ? ' data-act="stage" data-n="' + r.n + '" aria-label="ルール' + r.n + '"' : ' disabled aria-label="ルール' + r.n + ' 準備中"';
      return '<button class="' + cls + '"' + attr + ">" + r.n + "</button>";
    }).join("");

    var next = null;
    Object.keys(PLAY).forEach(function (n) { if (!next && !stat(+n).mastered) next = +n; });
    var miss = missed().length;
    var cta = "";
    if (next) {
      cta += '<button class="btn red" data-act="stage" data-n="' + next + '"><span>今日の1ステージ<br><small>ルール' + next + " " + esc(RULES[next - 1].jp) + '</small></span><span class="type">&rarr;</span></button>';
    } else {
      cta += '<p class="empty">いま遊べる3ステージはすべて習得しました。残りのステージは準備中です。</p>';
    }
    if (miss > 0) {
      cta += '<button class="btn alt" data-act="review"><span>ふくしゅう<br><small>間違えた問題 ' + miss + "問</small></span><span class=\"type\">&rarr;</span></button>";
    }

    var rows = "";
    RULES.forEach(function (r, idx) {
      if (idx === 0 || r.ch !== RULES[idx - 1].ch) rows += '<div class="chap">' + esc(CHAPTERS[r.ch]) + "</div>";
      var s = stat(r.n);
      if (s) {
        var b = s.mastered ? '<span class="badge done">習得</span>' : (s.answered ? '<span class="badge go">' + s.correct + "/" + s.total + "</span>" : '<span class="badge go">挑戦</span>');
        rows += '<button class="row" data-act="stage" data-n="' + r.n + '"><span class="no">' + r.n + '</span><span><span class="jp">' + esc(r.jp) + '</span><br><span class="en">' + esc(r.en) + "</span></span>" + b + "</button>";
      } else {
        rows += '<div class="row lock"><span class="no">' + r.n + '</span><span><span class="jp">' + esc(r.jp) + '</span><br><span class="en">' + esc(r.en) + '</span></span><span class="badge">準備中</span></div>';
      }
    });
    rows += '<div class="chap">このあと追加できるもの</div>';
    rows += '<div class="row lock"><span class="no">V</span><span><span class="jp">誤用されやすい語句</span><br><span class="en">Words and Expressions Commonly Misused</span></span><span class="badge">準備中</span></div>';
    rows += '<div class="row lock"><span class="no">VI</span><span><span class="jp">スペル</span><br><span class="en">Words often misspelled</span></span><span class="badge">準備中</span></div>';
    rows += '<div class="row lock"><span class="no">&#9998;</span><span><span class="jp">ボス戦: 自分の英文を添削</span><br><span class="en">Your own sentences, marked up</span></span><span class="badge">準備中</span></div>';

    return '<h1 class="title">悪文なおし道場</h1>' +
      '<p class="sub">The Elements of Style の全18ルールを、悪文を直して身につける。</p>' +
      '<div class="strip-head"><span class="small">習得</span><span class="type"><b>' + done + "</b> / 18</span></div>" +
      '<div class="strip">' + strip + "</div>" +
      '<div class="cta-row">' + cta + "</div>" + rows +
      '<p class="small" style="margin-top:28px">出典: William Strunk Jr., The Elements of Style (1918)。Project Gutenberg #37134、パブリックドメイン。記録はこの端末のブラウザに保存されます。</p>';
  }

  function ruleView() {
    var r = RULES[S.n - 1], d = PLAY[S.n];
    var ex = d.examples.map(function (e) {
      return '<button class="say" data-act="say" data-say="' + esc(e) + '">' + ICON + '<span class="sent">' + esc(e) + "</span></button>";
    }).join("");
    var notes = d.notes.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    return '<div class="bar"><button class="back" data-act="home">&larr; 戻る</button></div>' +
      '<div class="rulehead">RULE ' + r.n + "</div>" +
      '<h2 class="ruleen">' + esc(r.en) + "</h2>" +
      '<p class="rulejp">' + esc(d.gloss) + "</p>" +
      '<div class="manu"><span class="tag">本の例文(タップで音が聞けます)</span>' + ex + "</div>" +
      '<ul class="notes">' + notes + "</ul>" +
      '<div class="cta-row" style="margin-top:24px"><button class="btn red" data-act="start" data-n="' + r.n + '"><span>悪文なおしへ<br><small>' + d.qs.length + '問</small></span><span class="type">&rarr;</span></button></div>';
  }

  function barView() {
    var s = S.sess;
    var segs = s.items.map(function (it, i) {
      var c = "seg";
      if (it.picked !== null) c += it.opts[it.picked].ok ? " ok" : " ng"; else if (i === s.i) c += " now";
      return '<span class="' + c + '"></span>';
    }).join("");
    return '<div class="bar"><button class="back" data-act="home">&times; やめる</button><div class="segs" aria-hidden="true">' + segs + '</div><span class="count">' + (s.i + 1) + "/" + s.items.length + "</span></div>";
  }

  function quizView() {
    var s = S.sess, it = s.items[s.i], L = ["A", "B", "C", "D"];
    var answered = it.picked !== null;
    var opts = it.opts.map(function (o, k) {
      var cls = "opt", mark = ICON;
      if (answered) {
        if (o.ok) { cls += " right"; mark = '<span class="m">正解</span>'; }
        else if (k === it.picked) { cls += " wrong"; mark = '<span class="m">不正解</span>'; }
        else { mark = ICON; }
      }
      return '<button class="' + cls + '" data-k="' + k + '"><span class="l">' + L[k] + '</span><span class="t">' + esc(o.t) + "</span>" + mark + "</button>";
    }).join("");
    var fb = "";
    if (answered) {
      var good = it.opts[it.picked].ok;
      var last = s.i === s.items.length - 1;
      fb = '<div class="fb" id="fb" aria-live="polite"><div class="verdict ' + (good ? "ok" : "ng") + '">' + (good ? "正解" : "惜しい") + "</div>" +
        '<div class="rtag">RULE ' + it.n + "</div><p class=\"why\">" + esc(it.why) + "</p></div>" +
        '<button class="btn next" data-act="next"><span>' + (last ? "結果を見る" : "次の問題へ") + '</span><span class="type">&rarr;</span></button>';
    }
    var bad = it.bad ? '<div class="bad"><button class="say" data-act="say" data-say="' + esc(it.bad) + '">' + ICON + '<span class="sent"><span class="tag">原稿(タップで聞く)</span><span class="ul">' + esc(it.bad) + "</span></span></button></div>" : "";
    var hint = answered
      ? '<p class="hint">' + ICON + "どの文も、タップで聞き直せます</p>"
      : '<p class="hint">' + ICON + "タップ: 音を聞く / 長押し: これを答えにする</p>";
    return barView() + '<p class="q">' + esc(it.q) + "</p>" + bad + hint + '<div class="opts">' + opts + "</div>" + fb;
  }

  function resultView() {
    var s = S.sess, total = s.items.length;
    var okc = s.items.filter(function (it) { return it.opts[it.picked].ok; }).length;
    var wrong = s.items.filter(function (it) { return !it.opts[it.picked].ok; });
    var head, stamp = "";
    if (s.kind === "stage") {
      var st = stat(s.n);
      stamp = st.mastered ? '<div class="stamp">習得</div>' : '<div class="stamp soft">もう一歩</div>';
      head = "RULE " + s.n;
    } else { head = "ふくしゅう"; }
    var m = wrong.map(function (it) {
      return '<div class="item"><span class="tag">RULE ' + it.n + "</span>" +
        (it.bad ? '<p class="was">' + esc(it.bad) + "</p>" : "") +
        '<button class="say" data-act="say" data-say="' + esc(it.ok) + '">' + ICON + '<span class="sent fix" style="color:var(--ok);font-weight:700">' + esc(it.ok) + '</span></button><p class="small" style="margin-top:4px">' + esc(it.why) + "</p></div>";
    }).join("");
    var btns = "";
    if (s.kind === "stage") {
      btns += '<button class="btn alt" data-act="start" data-n="' + s.n + '"><span>もう一度</span><span class="type">&crarr;</span></button>';
      if (PLAY[s.n + 1]) btns += '<button class="btn red" data-act="stage" data-n="' + (s.n + 1) + '"><span>次のステージ<br><small>ルール' + (s.n + 1) + "</small></span><span class=\"type\">&rarr;</span></button>";
    } else if (missed().length) {
      btns += '<button class="btn alt" data-act="review"><span>残りをふくしゅう<br><small>' + missed().length + "問</small></span><span class=\"type\">&rarr;</span></button>";
    }
    btns += '<button class="btn alt" data-act="home"><span>ホームへ</span><span class="type">&rarr;</span></button>';
    return '<div class="rulehead">' + head + "</div>" +
      '<div class="score">' + okc + '<span class="small"> / ' + total + "</span></div>" + stamp +
      (wrong.length ? '<h3 class="chap" style="margin-top:22px">直し方の確認(タップで聞けます)</h3><div class="miss">' + m + "</div>" : '<p class="empty">全問正解です。</p>') +
      '<div class="cta-row" style="margin-top:26px">' + btns + "</div>";
  }

  function reviewEmptyView() {
    return '<div class="bar"><button class="back" data-act="home">&larr; 戻る</button></div><h2 class="title" style="font-size:26px">ふくしゅう</h2><p class="empty">間違えた問題はありません。</p>';
  }

  function render() {
    var html;
    if (S.view === "home") html = homeView();
    else if (S.view === "rule") html = ruleView();
    else if (S.view === "quiz") html = quizView();
    else if (S.view === "result") html = resultView();
    else html = reviewEmptyView();
    app.innerHTML = html;
  }

  /* ---------- 操作 ---------- */
  function startStage(n) {
    S.sess = { kind: "stage", n: n, i: 0, items: PLAY[n].qs.map(function (_, i) { return mk(n, i); }) };
    go("quiz", n);
  }
  function startReview() {
    var list = shuffle(missed()).slice(0, 5);
    if (!list.length) { go("empty"); return; }
    S.sess = { kind: "review", n: 0, i: 0, items: list.map(function (x) { return mk(x.n, x.i); }) };
    go("quiz");
  }
  function pick(k) {
    var it = cur();
    if (!it || it.picked !== null) return;
    it.picked = k;
    P[it.id] = it.opts[k].ok;
    save();
    render();
    try { var fb = document.getElementById("fb"); if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (err) {}
  }

  /* 選択肢: タップ=音を聞く / 長押し=答えにする */
  var HOLD_MS = 600, holdTimer = null, holdEl = null, holdFired = false;
  function endHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdEl) { try { holdEl.classList.remove("holding"); } catch (e) {} holdEl = null; }
  }
  app.addEventListener("pointerdown", function (e) {
    var el = e.target.closest("[data-k]");
    if (!el) return;
    var it = cur(); if (!it) return;
    endHold(); holdFired = false; holdEl = el;
    if (it.picked === null) {
      try { void el.offsetWidth; el.classList.add("holding"); } catch (err) {}
      holdTimer = setTimeout(function () { holdFired = true; var k = +el.dataset.k; endHold(); pick(k); }, HOLD_MS);
    }
  });
  app.addEventListener("pointerup", function (e) {
    var el = e.target.closest("[data-k]");
    var fired = holdFired, had = holdEl;
    endHold();
    if (!el || fired || !had) { holdFired = false; return; }
    var it = cur(); if (!it) return;
    say(it.opts[+el.dataset.k].t);
  });
  app.addEventListener("pointercancel", function () { endHold(); });
  app.addEventListener("contextmenu", function (e) { if (e.target.closest("[data-k], .say")) e.preventDefault(); });

  app.addEventListener("click", function (e) {
    var o = e.target.closest("[data-k]");
    if (o) { if (e.detail === 0) { var it0 = cur(); if (it0) say(it0.opts[+o.dataset.k].t); } return; }
    var el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    var act = el.dataset.act, n = el.dataset.n ? +el.dataset.n : 0;
    if (act === "home") { try { window.speechSynthesis.cancel(); } catch (err) {} go("home"); }
    else if (act === "stage") go("rule", n);
    else if (act === "start") startStage(n);
    else if (act === "review") startReview();
    else if (act === "say") say(el.dataset.say);
    else if (act === "next") {
      var s = S.sess;
      if (s.i < s.items.length - 1) { s.i++; go("quiz"); } else { go("result"); }
    }
  });

  render();
})();
</script>
</body>
</html>
